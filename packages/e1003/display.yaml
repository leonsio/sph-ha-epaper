display:
- platform: it8951
  id: epaper
  auto_clear_enabled: false
  spi_id: epaper_spi_bus
  model: seeed-reterminal-e1003
  vcom: 1400
  vcom_register: 2
  force_temperature: 25
  # epaper_refresh waits for LUTAFSR == 0, THEN sends STANDBY. The driver's
  # early sleep would freeze register polling; leaving the panel RUN is avoided.
  sleep_when_done: false
  update_interval: never
  # Seeed/ESPHome default: periodically refresh the whole GC16 area.
  # This single-frame refresh is separate from the multi-stage cleanup.
  full_update_every: 30
  grayscale: true
  dithering: false
  update_mode: GC16
  transform:
    mirror_x: true
    mirror_y: false
    swap_xy: false
  rotation: 0
  lambda: !include
    file: render.yaml
    vars:
      render_clock: !include render/clock.yaml
      render_common: !include render/common.yaml
      render_home: !include render/home.yaml
      render_start: !include render/start.yaml
      render_maxim: !include render/maxim.yaml
      render_elisa: !include render/elisa.yaml
      render_school: !include render/school.yaml
      render_weather: !include render/weather.yaml
