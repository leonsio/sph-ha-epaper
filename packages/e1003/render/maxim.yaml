      fast_rect(lx+11,ly+77,lw-22,48,LIGHT);
      text(lx+20,ly+83,"Std.",id(ui_small),INK,76);
      text(lx+105,ly+83,"Uhrzeit",id(ui_small),INK,203);
      text(lx+324,ly+83,"Fach / Raum / Lehrer",id(ui_small),INK,lw-347);
      it.line(lx+18,ly+131,lx+lw-18,ly+131,MID);
      if(!attrs["eigener_plan"].is<JsonArray>())text(lx+23,ly+158,"Stundenplandaten fehlen.",id(ui_body),INK,lw-46);
      else {
        JsonArray plan=attrs["eigener_plan"].as<JsonArray>();int dow=weekday(target);
        if(dow>=5||dow>=int(plan.size()))text(lx+23,ly+158,"Keine Stunden für diesen Tag.",id(ui_body),INK,lw-46);
        else{
          JsonArray lessons=plan[dow].as<JsonArray>();
          std::vector<JsonObject> active;
          for(JsonObject l:lessons)if(lesson_visible(l,lessons,week_type(target)))active.push_back(l);
          std::stable_sort(active.begin(),active.end(),[&](JsonObject a,JsonObject b){return atoi(raw_text(a["index"]).c_str())<atoi(raw_text(b["index"]).c_str());});
          int row=0;
          const bool compact=active.size()>6;
          const int row_height=std::max(62,std::min(93,(lh-148)/std::max(1,int(active.size()))));
          const int max_rows=std::max(1,(lh-148)/row_height);
          for(JsonObject l:active){if(row>=max_rows)break;
            const int py=ly+141+row*row_height;
            const int index=atoi(raw_text(l["index"]).c_str());
            const int duration=std::max(1,atoi(raw_text(l["duration"]).c_str()));
            std::string period=std::to_string(index)+(duration>1?"–"+std::to_string(index+duration-1):"");
            std::string subject=raw_text(l["fach"]);if(subject.empty())subject=raw_text(l["subject"]);
            std::string teacher=raw_text(l["teacher"]),room=raw_text(l["room"]),change;
            // KFG only: apply changes with matching date, original subject and period.
            if(substitutes["weeks"].is<JsonArray>()){
              JsonArray weeks=substitutes["weeks"].as<JsonArray>();
              for(JsonObject wk:weeks){JsonArray ds=wk["days"].as<JsonArray>();for(JsonObject d:ds){
                std::string dsdate=raw_text(d["date"]);int n=0,m=0,yr=0;
                if(parse_date(dsdate)!=target){
                  int c=sscanf(dsdate.c_str(),"%d.%d.%d",&n,&m,&yr);
                  if(c<2||m!=future.month||n!=future.day_of_month||(c==3&&yr>0&&yr!=future.year))continue;
                }
                JsonArray entries=d["entries"].as<JsonArray>();
                for(JsonObject e:entries){
                  std::string old=raw_text(e["fach_original"]);if(old.empty())old=raw_text(e["fach_alt"]);
                  if(old.empty())old=raw_text(e["fach"]);
                  std::string code=raw_text(l["subject"]);
                  if(!old.empty()&&old!=code&&old!=subject)continue;
                  std::string periods=raw_text(e["stunde"]);if(periods.empty())periods=raw_text(e["stunden"]);
                  int st=atoi(periods.c_str());if(st>0&&(st<index||st>=index+duration))continue;
                  std::string cls=raw_text(e["klasse"]);if(!cls.empty()&&cls.find("${school_class}")==std::string::npos)continue;
                  change=raw_text(e["art"]);if(change=="Entf")change="Entfall";if(change=="Vertr")change="Vertretung";
                  std::string replacement=raw_text(e["vertreter"]);if(!replacement.empty())teacher=replacement;
                  std::string newroom=raw_text(e["raum"]);if(!newroom.empty())room=newroom;
                  std::string newsubject=raw_text(e["fach"]);if(!newsubject.empty()&&newsubject!=code)subject=newsubject;
                  break;
                }
              }}
            }
            if(row%2==0)fast_rect(lx+10,py,lw-20,row_height-2,LIGHT);
            text(lx+22,py+8,period+".",id(font_lesson),INK,79);
            text(lx+105,py+12,raw_text(l["start"])+"–"+raw_text(l["end"]),id(ui_small),INK,207);
            if(compact){
              text(lx+325,py+11,subject,id(font_lesson),INK,190);
              text(lx+524,py+14,room+" · "+teacher+(change.empty()?"":" · "+change),id(ui_small),INK,lw-541);
            }else{
              text(lx+325,py+1,subject,id(font_lesson),INK,lw-346);
              text(lx+325,py+43,"Raum "+room+" · "+teacher+(change.empty()?"":" · "+change),id(ui_small),INK,lw-346);
            }
            if(change=="Entfall")it.line(lx+321,py+30,lx+lw-25,py+30,INK);
            row++;
          }
          if(active.empty())text(lx+25,ly+205,"Heute ist kein Unterricht eingetragen.",id(ui_body),INK,lw-55);
        }
      }
    }
    // Right sidebar: holidays, conditional KFG news and conditional changes.
    // All KFG data is date-scoped to the SAME chosen target as the timetable.
    const int hy=current_y+current_h+12,hh=145;
    std::string holiday_header=next_break.start<0?"Ferientermine ergänzen":next_break.name+" · "+short_date(next_break.start);
    if(next_break.official_start>=0&&next_break.official_start!=next_break.start)
      holiday_header+=" (offiziell "+short_date(next_break.official_start)+")";
    const bool holiday_card=card(4,rx,hy,rw,hh,holiday_header+std::to_string(next_break.active));
    if(holiday_card){
      text(rx+23,hy+9,"Ferien-Countdown",id(font_lesson),INK,rw-46);
      text(rx+23,hy+49,holiday_header,id(ui_small),INK,rw-46);
      const int64_t holiday_days=std::max(int64_t(0),next_break.start-today_day);
      const std::string counter=next_break.start<0?"Keine Termine":next_break.active?"Ferien!":
          std::to_string(holiday_days)+(holiday_days==1?" Tag":" Tage");
      text(rx+24,hy+85,counter,id(font_start_info),INK,rw-48);
    }
    const int ny=hy+hh+12,nh=150;
    std::string notices;
    std::vector<std::string> substitutions_today;
    auto matching_kfg_date=[&](const std::string &dsdate)->bool{
      int64_t date=parse_date(dsdate);
      if(date>=0)return date==target;
      int dd=0,mm=0,yy=0;
      const int count=sscanf(dsdate.c_str(),"%d.%d.%d",&dd,&mm,&yy);
      if(count<2||dd<1||dd>31||mm<1||mm>12)return false;
      if(count<3||yy<1)yy=future.year;
      if(yy<100)yy+=2000;
      return civil(yy,mm,dd)==target;
    };
    if(substitutes["weeks"].is<JsonArray>()){
      JsonArray weeks=substitutes["weeks"].as<JsonArray>();
      for(JsonObject wk:weeks){
        if(!wk["days"].is<JsonArray>())continue;
        JsonArray week_days=wk["days"].as<JsonArray>();
        for(JsonObject d:week_days){
          if(!matching_kfg_date(raw_text(d["date"])))continue;
          JsonVariant news=d["news"];
          if(news.is<JsonArray>()||news.is<JsonObject>()){
            std::vector<JsonVariant> pending{news};
            while(!pending.empty()){
              JsonVariant item=pending.back();pending.pop_back();
              if(item.is<JsonArray>()){
                JsonArray a=item.as<JsonArray>();
                for(int j=int(a.size())-1;j>=0;j--)pending.push_back(a[j]);
              }else if(item.is<JsonObject>()){
                for(JsonPair pair:item.as<JsonObject>())pending.push_back(pair.value());
              }else{
                std::string n=raw_text(item);
                if(!n.empty())notices+=(notices.empty()?"":" · ")+n;
              }
            }
          }else{
            std::string n=raw_text(news);
            if(!n.empty())notices+=(notices.empty()?"":" · ")+n;
          }
          if(!d["entries"].is<JsonArray>())continue;
          JsonArray day_entries=d["entries"].as<JsonArray>();
          for(JsonObject e:day_entries){
            // Only changes for Maxim's class; never show another class's changes.
            std::string classes=raw_text(e["klasse"]);
            if(!classes.empty()){
              bool relevant=false;
              std::string token;
              for(char c:classes){
                if(c==','||c==';'||c=='/'||c=='|'||std::isspace(static_cast<unsigned char>(c))){
                  if(token=="${school_class}")relevant=true;
                  token.clear();
                }else token+=c;
              }
              if(token=="${school_class}")relevant=true;
              if(!relevant)continue;
            }
            std::string art=raw_text(e["art"]);
            if(art.empty() && !(e["entfall"] | false))continue;
            if(art=="Vertr")art="Vertretung";
            else if(art=="Entf")art="Entfall";
            else if(art=="Raum")art="Raumänderung";
            else if(art=="Betr")art="Betreuung";
            else if(art=="Taus")art="Tausch";
            else if(art=="Freis")art="Freistunde";
            else if(art.empty())art="Entfall";
            std::string period=raw_text(e["stunde"]);
            if(period.empty())period=raw_text(e["stunden"]);
            std::string subject=raw_text(e["fach_original"]);
            if(subject.empty())subject=raw_text(e["fach_alt"]);
            if(subject.empty())subject=raw_text(e["fach"]);
            std::string entry=period.empty()?"":period+". Std. · ";
            entry+=subject.empty()?art:subject+" · "+art;
            std::string teacher=raw_text(e["vertreter"]),room=raw_text(e["raum"]);
            if(!teacher.empty())entry+=" · "+teacher;
            if(!room.empty())entry+=" · R "+room;
            std::string note=raw_text(e["hinweis"]);
            if(!note.empty())entry+=" · "+note;
            substitutions_today.push_back(entry);
          }
        }
      }
    }
    if(!notices.empty()&&card(5,rx,ny,rw,nh,notices+short_date(target))){
      text(rx+23,ny+9,"KFG · Nachricht des Tages",id(font_lesson),INK,rw-46);
      auto notice_lines=lines(notices,id(ui_small),rw-48);
      for(size_t i=0;i<notice_lines.size()&&i<3;i++)text(rx+23,ny+53+int(i)*29,notice_lines[i],id(ui_small),INK,rw-46);
    }
    const int sy=ny+(notices.empty()?0:nh+12),sh=150;
    if(!substitutions_today.empty()){
      std::string key=short_date(target);
      for(const auto& change:substitutions_today)key+=change;
      if(card(5+2,rx,sy,rw,sh,key)){
        text(rx+23,sy+9,"KFG · Vertretungen",id(font_lesson),INK,rw-46);
        const size_t visible=std::min(size_t(substitutions_today.size()>3?2:3),substitutions_today.size());
        for(size_t i=0;i<visible;i++)
          text(rx+23,sy+53+int(i)*29,substitutions_today[i],id(ui_small),INK,rw-46);
        if(substitutions_today.size()>visible)
          text(rx+23,sy+53+int(visible)*29,"+ "+std::to_string(substitutions_today.size()-visible)+" weitere",id(ui_small),INK,rw-46);
      }
    }
    const int wy=ly+lh+12,wh=H-wy-17;
    std::string upcoming;
    if(controls["leistungskontrollen"].is<JsonArray>()){
      JsonArray arr=controls["leistungskontrollen"].as<JsonArray>();int64_t earliest=INT64_MAX;
      for(JsonObject item:arr){int64_t d=parse_date(raw_text(item["datum"]));if(d<today_day||d>=earliest)continue;
        std::string title=raw_text(item["summary"]);if(title.empty())title=raw_text(item["art"])+" "+raw_text(item["kurs"]);
        if(d>=0){earliest=d;upcoming=short_date(d)+" · "+title;}
      }
    }
    if(upcoming.empty()&&cal["events"].is<JsonArray>()){
      JsonArray evts=cal["events"].as<JsonArray>();int64_t earliest=INT64_MAX;
      for(JsonObject item:evts){int64_t d=parse_date(raw_text(item["date"]));
        if(d<today_day||d>=earliest)continue;
        earliest=d;upcoming=short_date(d)+" · "+raw_text(item["summary"]);
      }
    }
    if(upcoming.empty()&&homework["aufgaben"].is<JsonArray>()){
      JsonArray arr=homework["aufgaben"].as<JsonArray>();int64_t earliest=INT64_MAX;
      for(JsonObject item:arr)if(!(item["erledigt"]|false)){
        int64_t d=parse_date(raw_text(item["datum"]));if(d<today_day||d>=earliest)continue;
        earliest=d;upcoming=short_date(d)+" · "+raw_text(item["fach"])+" Hausaufgabe";
      }
    }
    if(card(6,lx,wy,lw,wh,upcoming)){
      text(lx+23,wy+10,"Nicht vergessen",id(font_lesson),INK,lw-46);
      auto task_lines=lines(upcoming.empty()?"Keine kommenden Aufgaben oder Arbeiten.":upcoming,id(ui_body),lw-46);
      for(size_t i=0;i<task_lines.size()&&i<2;i++)text(lx+23,wy+67+int(i)*38,task_lines[i],id(ui_body),INK,lw-46);
    }
    const int by=H-137,bh=120;
    const float phone=id(maxim_phone_level).state;
    const bool phone_valid=std::isfinite(phone)&&phone>=0&&phone<=100;
    const bool low=phone_valid&&phone<30.0f;
    char phonebuf[32];snprintf(phonebuf,sizeof(phonebuf),"%d %%",phone_valid?int(std::floor(phone)):0);
    const std::string phone_key=phone_valid?phonebuf:std::string("n/a");
    if(card(3,rx,by,rw,bh,phone_key)){
      text(rx+23,by+12,"Maxims Handy",id(font_lesson),INK,rw-46);
      text(rx+23,by+54,phone_valid?phone_key:"Akku nicht verfügbar",id(font_start_info),INK,low?rw-280:rw-46);
      if(low){fast_rect(rx+rw-246,by+63,222,43,INK);center(rx+rw-135,by+85,"AKKU < 30 %",id(ui_small),PAPER);}
    }
    return;
  }
  // Elisa: monochrome RMV departure board. DU only for in-page changes.
