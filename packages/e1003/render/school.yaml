        int index=atoi(value(lesson["index"]).c_str());int duration=std::max(1,atoi(value(lesson["duration"]).c_str()));
        int start=minute(value(lesson["start"])),end=minute(value(lesson["end"]));
        if(index<1||index>8||start<0||end<=start)continue;
        double length=double(end-start)/duration;
        for(int off=0;off<duration&&index+off<=8;off++){slot_start[index+off]=int(std::lround(start+length*off));slot_end[index+off]=int(std::lround(start+length*(off+1)));}
      }
    }
    grid_mark("KFG-Daten und Stundenzeiten vorbereitet");
  
    // Geometry mirrors sph-stundenplan-grid-card: grey header/period column,
    // five equal weekday columns and eight periods. Calendar week and A/B school
    // week share the upper-left header cell, so no separate week row is needed.
    const int left=2,right=W-2,period_w=282;
    const int header_top=CONTENT_TOP+6,header_h=112,body_top=header_top+header_h,body_bottom=H-8;
    const int grid_left=left+period_w,day_w=(right-grid_left)/5,body_h=body_bottom-body_top;
    const Color GRID(188,188,188),META(96,96,96),HEADER(208,208,208);
    // ISO calendar week: the ISO year/week is defined by the Thursday of this Monday-based week.
    auto iso_thursday=esphome::ESPTime::from_epoch_utc((monday+3)*86400);
    int64_t jan4=civil(iso_thursday.year,1,4);
    int jan4_wd=int((jan4+3)%7);if(jan4_wd<0)jan4_wd+=7;
    int64_t week1_monday=jan4-jan4_wd;
    int calendar_week=int((monday-week1_monday)/7)+1;
    char kwbuf[16];snprintf(kwbuf,sizeof(kwbuf),"KW %02d",calendar_week);
    fast_rect(left,header_top,period_w,header_h,HEADER);it.rectangle(left,header_top,period_w,header_h,GRID);
    center(left+period_w/2,header_top+32,kwbuf,id(font_small),INK);
    std::string school_week_text="Woche";
    if(!school_week.empty())school_week_text+=" "+school_week;
    center(left+period_w/2,header_top+80,school_week_text,id(font_small),INK);
    const char* day_names[]={"Montag","Dienstag","Mittwoch","Donnerstag","Freitag"};
    for(int d=0;d<5;d++){
      int x=grid_left+d*day_w;int x2=d==4?right:x+day_w;int w=x2-x;
      fast_rect(x,header_top,w,header_h,HEADER);it.rectangle(x,header_top,w,header_h,GRID);
      auto date=esphome::ESPTime::from_epoch_utc((monday+d)*86400);
      center(x+w/2,header_top+34,day_names[d],id(font_day),INK);
      char dbuf[20];snprintf(dbuf,sizeof(dbuf),"%02d.%02d.%04d",date.day_of_month,date.month,date.year);
      center(x+w/2,header_top+84,dbuf,id(ui_small),INK);
    }
    for(int p=1;p<=8;p++){
      int y=body_top+(p-1)*body_h/8,y2=body_top+p*body_h/8,h=y2-y;
      fast_rect(left,y,period_w,h,HEADER);it.rectangle(left,y,period_w,h,GRID);
      center(left+period_w/2,y+40,std::to_string(p)+".",id(font_small),INK);
      char tbuf[64];snprintf(tbuf,sizeof(tbuf),"%02d:%02d – %02d:%02d",slot_start[p]/60,slot_start[p]%60,slot_end[p]/60,slot_end[p]%60);
      center(left+period_w/2,y+h-35,tbuf,id(ui_small),INK);
      for(int d=0;d<5;d++){int x=grid_left+d*day_w,x2=d==4?right:x+day_w;it.rectangle(x,y,x2-x,h,GRID);}
    }
    grid_mark("Grundraster gezeichnet");
  
    auto draw_badge=[&](int cx,int y,const std::string&label,Color shade,int maxw){
      std::string shown=fit(label,id(font_meta),maxw-20);int bw=std::min(maxw,width(shown,id(font_meta))+24);int bh=34;
      fast_rect(cx-bw/2,y,bw,bh,shade);center(cx,y+bh/2,shown,id(font_meta),PAPER);return bh;
    };
    auto draw_card=[&](int x,int y,int w,int h,bool highlighted){
      const int card_margin=5;
      const int shadow=6;
      const int card_x=x+card_margin;
      const int card_y=y+card_margin;
      const int card_w=std::max(12,w-(card_margin*2)-shadow);
      const int card_h=std::max(12,h-(card_margin*2)-shadow);
      const Color shadow_color(176,176,176);
      const Color border_color(88,88,88);
      // Jede Stundenplanzelle wirkt wie eine leicht angehobene Kachel.
      fast_rect(card_x+card_w,card_y+shadow,shadow,std::max(1,card_h-shadow),shadow_color);
      fast_rect(card_x+shadow,card_y+card_h,std::max(1,card_w-shadow),shadow,shadow_color);
      // Leistungskontrollen werden zusätzlich mit einer sehr hellen Graustufe abgesetzt.
      fast_rect(card_x,card_y,card_w,card_h,highlighted?Color(224,224,224):PAPER);
      it.rectangle(card_x,card_y,card_w,card_h,border_color);
      if(card_w>18&&card_h>18)it.rectangle(card_x+2,card_y+2,card_w-4,card_h-4,Color(196,196,196));
    };
    auto draw_lesson=[&](JsonObject raw,int64_t date,int x,int y,int w,int h){
      std::string subject=value(raw["fach"]);if(subject.empty())subject=subject_name(value(raw["subject"]));if(subject.empty())subject="Unterricht";
      std::string teacher=teacher_name(value(raw["teacher"]));std::string room=value(raw["room"]);
      std::string original_subject,change,control_art;bool cancelled=false;
      JsonObject entry=find_entry(raw,date);
      if(!entry.isNull()){
        std::string art=change_label(value(entry["art"]));if(art.empty())art=value(entry["art_lang"]);if(art.empty())art="Vertretung";
        cancelled=(entry["entfall"]|false)||art=="Entfall"||art=="Freistunde";
        std::string new_code=value(entry["fach"]);if(new_code.empty())new_code=value(entry["subject"]);if(new_code.empty())new_code=value(raw["subject"]);
        std::string old_code=value(entry["fach_original"]);if(old_code.empty())old_code=value(entry["fach_alt"]);if(old_code.empty())old_code=value(entry["subject_original"]);if(old_code.empty())old_code=value(raw["subject"]);
        const bool changed_subject=!cancelled&&!new_code.empty()&&!old_code.empty()&&upper(new_code)!=upper(old_code);
        if(!cancelled&&!new_code.empty())subject=subject_name(new_code);
        if(changed_subject){original_subject=subject_name(old_code);change="Fachwechsel";}else change=art;
        std::string repl=value(entry["vertreter"]);if(repl.empty())repl=value(entry["lehrer_nach"]);if(repl.empty())repl=value(entry["lehrer"]);if(repl.empty())repl=value(entry["teacher"]);
        if(!repl.empty())teacher=teacher_name(repl);
        std::string new_room=value(entry["raum"]);if(new_room.empty())new_room=value(entry["room"]);if(!new_room.empty())room=new_room;
      }
      JsonObject control=find_control(raw,date);
      if(!control.isNull()){control_art=value(control["art"]);if(control_art.empty())control_art="Leistungskontrolle";}
      const bool changed=!change.empty();
      const bool has_control=!control_art.empty();
      // Einheitlicher Kartenstil für alle Unterrichtszellen; Leistungskontrollen
      // erhalten zusätzlich eine dezente graue Innenfläche.
      draw_card(x,y,w,h,has_control);
      if(changed){Color stripe=cancelled?Color(72,72,72):Color(128,128,128);fast_rect(x+12,y+18,6,std::max(8,h-36),stripe);}
      int maxw=w-34;int total=40;
      if(!original_subject.empty())total+=24;
      if(changed)total+=34;
      if(has_control)total+=34;
      if(!teacher.empty())total+=25;
      if(!room.empty())total+=25;
      int yy=y+std::max(4,(h-total)/2);
      auto sf=width(subject,id(font_lesson))<=maxw?id(font_lesson):id(font_small);
      std::string shown=fit(subject,sf,maxw);center(x+w/2,yy+18,shown,sf,INK);
      if(cancelled){int sw=width(shown,sf);it.line(x+w/2-sw/2,yy+18,x+w/2+sw/2,yy+18,INK);}
      yy+=40;
      if(!original_subject.empty()){center(x+w/2,yy+11,fit("statt "+original_subject,id(font_meta),maxw),id(font_meta),INK);yy+=24;}
      if(changed){
        Color badge=cancelled?Color(80,80,80):(change=="Vertretung"?Color(120,120,120):(change=="Sonderunterricht"?Color(144,144,144):Color(104,104,104)));
        draw_badge(x+w/2,yy,change,badge,maxw);yy+=34;
      }
      if(has_control){
        Color badge=(control_art=="Arbeit"||control_art=="Klausur")?Color(72,72,72):Color(112,112,112);
        draw_badge(x+w/2,yy,control_art,badge,maxw);yy+=34;
      }
      if(!teacher.empty()){center(x+w/2,yy+11,fit(teacher,id(font_meta),maxw),id(font_meta),META);yy+=25;}
      if(!room.empty()){center(x+w/2,yy+11,fit("Raum: "+room,id(font_meta),maxw),id(font_meta),META);yy+=25;}
    };
  
    bool covered[5][9]={{false}};
    for(int d=0;d<5;d++){
      const int64_t date=monday+d;
      JsonArray day=attrs["eigener_plan"][d].as<JsonArray>();
      int x=grid_left+d*day_w,x2=d==4?right:x+day_w,w=x2-x;
      const bool day_off=free_day(date);
      for(int p=1;p<=8;p++){
        if(covered[d][p])continue;
        int y=body_top+(p-1)*body_h/8,y_next=body_top+p*body_h/8;
        JsonObject starts[3];int count=0,span=1;
        if(!day_off)for(JsonObject lesson:day){
          if(!visible_lesson(lesson,day,school_week))continue;
          int index=atoi(value(lesson["index"]).c_str());if(index!=p)continue;
          if(count<3)starts[count++]=lesson;
          span=std::max(span,std::max(1,atoi(value(lesson["duration"]).c_str())));
        }
        span=std::min(span,9-p);
        if(count==0){center(x+w/2,(y+y_next)/2,"–",id(ui_body),META);continue;}
        int y2=body_top+(p-1+span)*body_h/8,h=y2-y;
        for(int q=p+1;q<p+span&&q<=8;q++)covered[d][q]=true;
        if(count==1){draw_lesson(starts[0],date,x,y,w,h);}
        else{
          int inner_h=h/count;
          for(int i=0;i<count;i++){
            int sy=y+i*inner_h,sy2=i==count-1?y+h:sy+inner_h;
            draw_lesson(starts[i],date,x,sy,w,sy2-sy);
          }
        }
      }
    }
    grid_mark("Unterricht, KFG-Änderungen und Leistungskontrollen gezeichnet");
    ESP_LOGI("timetable_timing","ENDE KFG-Stundenplan: %u ms gesamt",(unsigned)(millis()-grid_t0));
    return;
  }
  if(id(current_page)==6){
    heading("Die nächsten Arbeiten","Leistungskontrollen aus SPH Lerngruppen");
    auto doc=parse_payload(id(epaper_learning_groups_json).state);
    if(!doc["leistungskontrollen"].is<JsonArray>()){empty("Lerngruppendaten fehlen oder sind ungültig.");return;}
    JsonArray kontrollen=doc["leistungskontrollen"].as<JsonArray>();
    std::vector<JsonObject> items;for(JsonObject item:kontrollen){int64_t day=parse_day(value(item["datum"]));if(day<0||today<0||day>=today)items.push_back(item);}
    std::stable_sort(items.begin(),items.end(),[&](JsonObject a,JsonObject b){return value(a["datum"])+value(a["start"])<value(b["datum"])+value(b["start"]);});
    struct ExamCard { std::string date; std::vector<std::string> title, details; int height; };
    std::vector<ExamCard> cards;
    const int gap=24, card_w=(W-40-gap)/2, inner_w=card_w-40;
    const char* weekdays[]={"Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"};
    for(auto item:items){
      const int64_t day=parse_day(value(item["datum"]));
      std::string title=value(item["summary"]);
      if(title.empty())title=value(item["art"])+": "+value(item["kurs"]);
      std::string date="Datum offen";
      if(day>=0)date=std::string(weekdays[(day+4)%7])+", "+short_date(day);
      std::string hours;
      if(item["stunden"].is<JsonArray>()){
        JsonArray hour_values=item["stunden"].as<JsonArray>();
        for(JsonVariant v:hour_values)hours+=(hours.empty()?"":", ")+value(v);
      }else hours=value(item["stunden"]);
      std::string detail;
      if(!hours.empty())detail="Stunde: "+hours;
      const std::string teacher=value(item["lehrkraft"]);
      if(!teacher.empty())detail+=(detail.empty()?"":" · ")+std::string("Lehrkraft: ")+teacher;
      auto title_lines=lines(title,id(ui_tab),inner_w);
      auto detail_lines=lines(detail,id(ui_small),inner_w);
      // Split unusually long titles into continuation cards instead of clipping.
      for(size_t offset=0;offset<std::max(size_t(1),title_lines.size());offset+=12){
        size_t end=std::min(title_lines.size(),offset+12);
        std::vector<std::string> chunk(title_lines.begin()+std::min(offset,title_lines.size()),title_lines.begin()+end);
        cards.push_back({date+(offset?" · Fortsetzung":""),chunk,detail_lines,88+int(chunk.size())*42+int(detail_lines.size())*32});
      }
    }
    struct ExamSlot {int index,x,y;};
    std::vector<std::vector<ExamSlot>> pages(1);
    const int top=CONTENT_TOP+106,bottom=H-92;
    int column=0,y=top;
    for(int i=0;i<(int)cards.size();i++){
      if(y+cards[i].height>bottom && y>top){column++;y=top;}
      if(column==2){pages.push_back({});column=0;}
      pages.back().push_back({i,20+column*(card_w+gap),y});y+=cards[i].height+18;
    }
    pager(pages.size(),false);
    for(auto slot:pages[id(list_offset)]){
      const auto &card=cards[slot.index];
      it.rectangle(slot.x,slot.y,card_w,card.height,MID);
      fast_rect(slot.x,slot.y,5,card.height,INK);
      text(slot.x+20,slot.y+14,card.date,id(ui_small),INK,inner_w);
      int yy=slot.y+54;
      for(auto &line:card.title){text(slot.x+20,yy,line,id(ui_tab),INK,inner_w);yy+=42;}
      yy+=12;
      for(auto &line:card.details){text(slot.x+20,yy,line,id(ui_small),INK,inner_w);yy+=32;}
    }
    if(cards.empty())empty("Keine kommenden Arbeiten vorhanden.");
    return;
  }
  
  if(id(current_page)==5){
    heading("Meine Hausaufgaben","Offene Aufgaben aus SPH Mein Unterricht");
    auto doc=parse_payload(id(epaper_homework_json).state);
    if(!doc["aufgaben"].is<JsonArray>()){empty("Hausaufgabendaten fehlen oder sind ungültig.");return;}
    JsonArray aufgaben=doc["aufgaben"].as<JsonArray>();
    std::vector<JsonObject> tasks;for(JsonObject item:aufgaben)if(!(item["erledigt"]|false))tasks.push_back(item);
    std::stable_sort(tasks.begin(),tasks.end(),[&](JsonObject a,JsonObject b){return value(a["datum"])<value(b["datum"]);});
    for(auto item:tasks){std::string subject=value(item["fach"]),topic=value(item["thema"]),date=value(item["datum"]);int64_t day=parse_day(date);
      rows.push_back({subject+(topic.empty()?"":" · "+topic),(day>=0?"Datum: "+short_date(day):"Ohne Datum")+" · "+value(item["lehrer"]),value(item["aufgabe"]),rows.size()%2?LIGHT:MID});
    }
    if(rows.empty())empty("Keine unerledigten Hausaufgaben.");render_rows(false);return;
  }
  if(id(current_page)==4){
    heading("KFG Vertretungsplan · Klasse ${school_class}","Veröffentlichte Tage ab heute · Entfall dunkel, Vertretung mittel, sonstige Änderungen hell");
    if(!now.is_valid()){empty("Uhrzeit wird synchronisiert ...");return;}
    auto doc=parse_payload(id(kfg_substitution_json).state);
    if(!doc["weeks"].is<JsonArray>()){empty("KFG-Daten fehlen: ${kfg_substitution_entity} / Attribut json");return;}
    auto teachers=parse_payload(id(kfg_teachers).state);
    auto upper=[](std::string s){for(char&c:s)c=std::toupper(static_cast<unsigned char>(c));
      for(auto p:{std::pair<const char*,const char*>("ä","Ä"),{"ö","Ö"},{"ü","Ü"},{"ß","SS"}}){size_t at=0;while((at=s.find(p.first,at))!=std::string::npos){s.replace(at,strlen(p.first),p.second);at+=strlen(p.second);}}return s;};
    auto teacher=[&](std::string s){std::string name=value(teachers[s]);if(name.empty())for(JsonPair p:teachers.as<JsonObject>())if(upper(p.key().c_str())==upper(s)){name=value(p.value());break;}return name.empty()?s:name+" ("+s+")";};
    auto subject_name=[&](std::string s){const std::pair<const char*,const char*> subjects[]={{"E","Englisch"},{"E1","Englisch"},{"E2","Englisch"},{"D","Deutsch"},{"M","Mathematik"},{"SP","Sport"},{"BIO","Biologie"},{"CH","Chemie"},{"F","Französisch"},{"F2","Französisch"},{"L","Latein"},{"L1","Latein"},{"L2","Latein"},{"GE","Geschichte"},{"PW","Politik und Wirtschaft"},{"GR","Griechisch"},{"ETH","Ethik"},{"REV","Evangelische Religion"},{"RKA","Katholische Religion"},{"KU","Kunst"},{"PH","Physik"},{"MUS","Musik"},{"MU","Musik"},{"DSP","Darstellendes Spiel"}};for(auto p:subjects)if(upper(s)==p.first)return std::string(p.second);return s;};
    auto label=[](std::string s){const std::pair<const char*,const char*> labels[]={{"Betr","Betreuung"},{"Vertr","Vertretung"},{"Entf","Entfall"},{"Taus","Tausch"},{"Freis","Freistunde"},{"Raum","Raumänderung"},{"Paus","Pausenaufsicht"},{"SES","Sonderunterricht"},{"Vtr. ohne Lehrer","Vertretung ohne Lehrer"}};for(auto p:labels)if(s==p.first)return std::string(p.second);return s;};
    // KFG provides DD.MM. dates. Infer the year nearest generated/today to handle December/January.
    int64_t reference=parse_day(value(doc["today"]));if(reference<0)reference=today;
    int refyear=esphome::ESPTime::from_epoch_utc(reference*86400).year;
    auto kfg_day=[&](std::string s){int64_t direct=parse_day(s);if(direct>=0)return direct;int d=0,m=0,y=0;int count=sscanf(s.c_str(),"%d.%d.%d",&d,&m,&y);if(count<2||m<1||m>12||d<1||d>31)return int64_t(-1);if(count==3&&y>0)return civil(y<100?2000+y:y,m,d);int64_t best=civil(refyear,m,d);for(int yr:{refyear-1,refyear+1}){int64_t candidate=civil(yr,m,d);if(std::abs(candidate-reference)<std::abs(best-reference))best=candidate;}return best;};
    struct Day{int64_t date;JsonObject day;std::string week;};std::vector<Day> days;
    JsonArray published_weeks=doc["weeks"].as<JsonArray>();
    for(JsonObject week:published_weeks){JsonArray published_days=week["days"].as<JsonArray>();for(JsonObject day:published_days){int64_t d=kfg_day(value(day["date"]));if(d>=today)days.push_back({d,day,value(week["week_type"])});}}
    std::stable_sort(days.begin(),days.end(),[](const Day&a,const Day&b){return a.date<b.date;});
    // Flatten nested news arrays/objects iteratively; never discard published daily notices.
    auto news_text=[&](JsonVariant input){std::string out;std::vector<JsonVariant> pending{input};while(!pending.empty()){auto v=pending.back();pending.pop_back();if(v.is<JsonArray>()){auto a=v.as<JsonArray>();for(int i=int(a.size())-1;i>=0;i--)pending.push_back(a[i]);}else if(v.is<JsonObject>()){for(JsonPair pair:v.as<JsonObject>())pending.push_back(pair.value());}else{std::string s=value(v);if(!s.empty())out+=(out.empty()?"":" · ")+s;}}return out;};
    for(auto&d:days){std::string title=value(d.day["weekday"])+" "+short_date(d.date)+" · "+d.week;
      JsonVariant news_input=d.day["news"];
      if(news_input.is<JsonArray>()){
        JsonArray notices=news_input.as<JsonArray>();
        for(JsonVariant notice:notices){
          std::string news=news_text(notice);if(!news.empty())rows.push_back({title,"Nachricht des Tages",news,LIGHT});
        }
      }else{
        std::string news=news_text(news_input);if(!news.empty())rows.push_back({title,"Nachricht des Tages",news,LIGHT});
      }
      int n=0;JsonArray entries=d.day["entries"].as<JsonArray>();for(JsonObject e:entries){
        std::string art=label(value(e["art"]));bool cancelled=art=="Entfall"||art=="Freistunde"||(e["entfall"]|false);
        std::string subject=subject_name(value(e["fach"])),oldsubject=subject_name(value(e["fach_original"]));if(oldsubject.empty())oldsubject=subject_name(value(e["fach_alt"]));
        if(!oldsubject.empty()&&oldsubject!=subject)subject=oldsubject+" -> "+subject;
        std::string body="Lehrer: "+teacher(value(e["lehrer_original"]))+" · Vertretung: "+teacher(value(e["vertreter"]))+" · Raum: "+value(e["raum"]);
        std::string note=value(e["hinweis"]);if(!note.empty())body+=" · "+note;
        rows.push_back({title,"Stunde "+value(e["stunde"])+" · "+subject+" · "+art,body,cancelled?DARK:(art=="Vertretung"?MID:LIGHT),false});n++;
      }
      if(!n)rows.push_back({title,"Keine Vertretungen","Für diesen veröffentlichten Tag sind keine Änderungen gemeldet.",LIGHT});
    }
    if(days.empty())empty("Noch kein aktueller oder zukünftiger KFG-Plantag veröffentlicht.");
    render_days();return;
  }
  
