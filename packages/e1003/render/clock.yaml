|
  if(id(sd_photos).active()){
  if(id(screensaver_source).current_option()=="Bild"){
    id(sd_photos).render();
    return;
  }
  const int W=it.get_width(), H=it.get_height();
  auto &plan=screensaver_ui::plan;
  const int part=id(screensaver_clock_part);
  const int CLOCK_TOP=240;
  const Color ink=Color::BLACK, paper=Color::WHITE;
  auto now=id(ha_time).now();
  if(plan.epoch>0)now=esphome::ESPTime::from_epoch_local(plan.epoch);
  if(!now.is_valid()){
    id(screensaver_clock_full)=true;
    it.fill(paper);
    it.print(W/2,H/2,id(font_weather_condition),ink,TextAlign::CENTER,"Uhrzeit wird synchronisiert");
    return;
  }
  const bool analog=id(screensaver_source).current_option()=="Analoge Uhr";
  static bool clock_valid=false, painted_analog=false;
  static int painted_hour=-1, painted_minute=-1;
  static int minute_length=0;
  static std::string painted_date, painted_weather;
  const bool full=id(screensaver_clock_full) || !clock_valid || painted_analog!=analog;
  static const char *days[]={"", "Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
  
  auto weather_text=[&]()->const char *{
    const std::string condition=plan.condition;
    if(condition=="sunny")return "Sonnig";
    if(condition=="clear-night")return "Klare Nacht";
    if(condition=="partlycloudy")return "Teilweise bewölkt";
    if(condition=="cloudy")return "Bewölkt";
    if(condition=="fog")return "Nebel";
    if(condition=="rainy")return "Regen";
    if(condition=="pouring")return "Starker Regen";
    if(condition=="snowy")return "Schnee";
    if(condition=="snowy-rainy")return "Schneeregen";
    if(condition=="hail")return "Hagel";
    if(condition=="lightning" || condition=="lightning-rainy")return "Gewitter";
    if(condition=="windy" || condition=="windy-variant")return "Windig";
    if(condition=="exceptional")return "Außergewöhnlich";
    return "Wetter nicht verfügbar";
  };
  char date_buffer[96];
  snprintf(date_buffer,sizeof(date_buffer),"%s, %02d.%02d.%04d",
           days[now.day_of_week],now.day_of_month,now.month,now.year);
  const std::string date_text=date_buffer;
  auto weather_line=[&](){
    const std::string raw=plan.temperature;
    char *end=nullptr;float temperature=strtof(raw.c_str(),&end);
    char buffer[128];
    if(end!=raw.c_str() && std::isfinite(temperature))
      snprintf(buffer,sizeof(buffer),"%s · %.1f °C",weather_text(),temperature);
    else snprintf(buffer,sizeof(buffer),"%s · -- °C",weather_text());
    return std::string(buffer);
  };
  const std::string weather_text_line=weather_line();
  auto footer_row=[&](int y,const std::string &value,const std::string &previous){
    if(!full){
      int x=0,ty=0,w=0,h=0;
      it.get_text_bounds(W/2,y,previous.c_str(),id(font_weather_condition),TextAlign::CENTER,&x,&ty,&w,&h);
      esphome::it8951_native::fill_gray4_rect(id(epaper),x-2,ty-2,w+4,h+4,paper);
    }
    it.print(W/2,y,id(font_weather_condition),ink,TextAlign::CENTER,value.c_str());
  };
  auto analog_hand=[&](int hour,int minute,int length,int width,bool minute_hand,Color color){
    const int cx=W/2, cy=(H-190+CLOCK_TOP)/2;
    const double tick=minute_hand ? double(minute) : (hour%12)*5+minute/12.0;
    const double a=tick*3.141592653589793/30.0-3.141592653589793/2;
    const int ex=cx+int(length*cos(a)),ey=cy+int(length*sin(a));
    const int dx=int(width*sin(a)),dy=-int(width*cos(a));
    it.filled_triangle(cx+dx,cy+dy,cx-dx,cy-dy,ex,ey,color);
  };
  auto digital_geometry=[&](int centers[5],int &cell_w,int &cell_h,int &cy){
    int bx=0,by=0,bw=0,bh=0;
    it.get_text_bounds(0,0,"8",id(font_screensaver_clock),TextAlign::TOP_LEFT,&bx,&by,&bw,&bh);
    cell_w=bw+24;cell_h=bh+34;
    int colon_w=0,colon_h=0;
    it.get_text_bounds(0,0,":",id(font_screensaver_clock),TextAlign::TOP_LEFT,&bx,&by,&colon_w,&colon_h);
    const int colon_slot=colon_w+24, left=(W-4*cell_w-colon_slot)/2;
    cy=(H-190+CLOCK_TOP)/2;
    centers[0]=left+cell_w/2;centers[1]=left+cell_w*3/2;
    centers[2]=W/2;
    centers[3]=left+2*cell_w+colon_slot+cell_w/2;
    centers[4]=left+3*cell_w+colon_slot+cell_w/2;
  };
  
  {
    if(full)it.fill(paper);
    if(analog && (full || part==5)){
      const int cx=W/2, cy=(H-190+CLOCK_TOP)/2, r=std::min(W/2-30,cy-CLOCK_TOP-20);
      if(full){
        minute_length=int(r*0.79);
        it.circle(cx,cy,r,ink);
        for(int m=0;m<60;m++){
        const double a=m*3.141592653589793/30.0-3.141592653589793/2;
        const int inner=r-(m%5==0?42:17);
        for(int offset=-1;offset<=1;offset++)
          it.line(cx+int(inner*cos(a))+offset,cy+int(inner*sin(a)),cx+int((r-8)*cos(a))+offset,cy+int((r-8)*sin(a)),ink);
        if(m%5==0){
          const int tx=cx+int((r-85)*cos(a)),ty=cy+int((r-85)*sin(a));
          char label[4];snprintf(label,sizeof(label),"%d",m==0?12:m/5);
          it.print(tx,ty,id(font_start_weather),ink,TextAlign::CENTER,label);
          int x=0,y=0,w=0,h=0;
          it.get_text_bounds(tx,ty,label,id(font_start_weather),TextAlign::CENTER,&x,&y,&w,&h);
          const int dx=std::max(0,std::max(x-cx,cx-(x+w)));
          const int dy=std::max(0,std::max(y-cy,cy-(y+h)));
          minute_length=std::min(minute_length,std::max(0,int(std::sqrt(double(dx*dx+dy*dy)))-16));
        }
        }
      }
      if(full || now.hour!=painted_hour || now.minute!=painted_minute){
        // Hands stop inside the number ring. Erasing their old silhouettes
        // cannot erase dial numbers/ticks; redraw both hands for intersections.
        if(!full){
          analog_hand(painted_hour,painted_minute,int(r*0.55),18,false,paper);
          analog_hand(painted_hour,painted_minute,minute_length,11,true,paper);
        }
        analog_hand(now.hour,now.minute,int(r*0.55),18,false,ink);
        analog_hand(now.hour,now.minute,minute_length,11,true,ink);
        it.filled_circle(cx,cy,24,ink);
      }
      painted_hour=now.hour;painted_minute=now.minute;
    }else if(!analog && (full || (part>=1 && part<=4))){
      int centers[5],cell_w=0,cell_h=0,cy=0;
      digital_geometry(centers,cell_w,cell_h,cy);
      char digits[32];snprintf(digits,sizeof(digits),"%02d%02d",now.hour,now.minute);
      const int slots[4]={0,1,3,4};
      for(int i=0;i<4;i++){
        if(!full && part!=i+1)continue;
        if(!full)esphome::it8951_native::fill_gray4_rect(id(epaper),centers[slots[i]]-cell_w/2,cy-cell_h/2,cell_w,cell_h,paper);
        it.printf(centers[slots[i]],cy,id(font_screensaver_clock),ink,TextAlign::CENTER,"%c",digits[i]);
      }
      if(full)it.print(centers[2],cy,id(font_screensaver_clock),ink,TextAlign::CENTER,":");
    }
    if(full || part==6){footer_row(H-155,date_text,painted_date);painted_date=date_text;}
    if(full || part==7){footer_row(H-65,weather_text_line,painted_weather);painted_weather=weather_text_line;}
    if(full || part==8){
      const int width=(W-72)/2;
      if(!full)esphome::it8951_native::fill_gray4_rect(id(epaper),24,20,width,CLOCK_TOP-40,paper);
      const int count=plan.waste.size();
      if(count){
        const int cell=std::min(280,width/count);
        for(int i=0;i<count;++i){
          const int cx=24+i*cell+cell/2;
          const auto key=screensaver_ui::lower(plan.waste[i]);
          auto *icon=id(waste_rest);
          if(key.find("gelb")!=std::string::npos || key.find("wertstoff")!=std::string::npos)icon=id(waste_gelb);
          else if(key.find("grün")!=std::string::npos || key.find("gruen")!=std::string::npos ||
                  key.find("garten")!=std::string::npos)icon=id(waste_gruen);
          else if(key.find("bio")!=std::string::npos)icon=id(waste_bio);
          else if(key.find("papier")!=std::string::npos || key.find("pappe")!=std::string::npos ||
                  key.find("blaue tonne")!=std::string::npos)icon=id(waste_papier);
          it.image(cx-32,20,icon,ink);
          auto label=plan.waste[i];
          int bx=0,by=0,bw=0,bh=0;
          while(!label.empty()){
            it.get_text_bounds(0,0,label.c_str(),id(ui_small),TextAlign::TOP_LEFT,&bx,&by,&bw,&bh);
            if(bw<=cell-12)break;
            size_t p=label.size()-1;
            while(p>0 && (static_cast<unsigned char>(label[p])&0xC0)==0x80)--p;
            label.resize(p);
          }
          it.print(cx,92,id(ui_small),ink,TextAlign::TOP_CENTER,label.c_str());
          it.print(cx,124,id(ui_small),ink,TextAlign::TOP_CENTER,"Morgen");
          it.print(cx,156,id(ui_small),ink,TextAlign::TOP_CENTER,plan.waste_date.c_str());
        }
      }
    }
    if(full || part==9){
      const int x=W/2+12, width=(W-72)/2;
      if(!full)esphome::it8951_native::fill_gray4_rect(id(epaper),x,20,width,CLOCK_TOP-40,paper);
      const int count=plan.appliances.size();
      if(count){
        const int cell=std::min(280,width/count);
        for(int i=0;i<count;++i){
          const auto &a=plan.appliances[i];
          const int left=W-24-(i+1)*cell, cx=left+cell/2;
          it.print(cx,20,id(mdi_start_appliance),ink,TextAlign::TOP_CENTER,screensaver_ui::appliance_icon(a.name));
          auto line=[&](int y,const std::string &value,auto font){
            std::string label=value;
            int bx=0,by=0,bw=0,bh=0;
            while(!label.empty()){
              it.get_text_bounds(0,0,label.c_str(),font,TextAlign::TOP_LEFT,&bx,&by,&bw,&bh);
              if(bw<=cell-12)break;
              size_t p=label.size()-1;
              while(p>0 && (static_cast<unsigned char>(label[p])&0xC0)==0x80)--p;
              label.resize(p);
            }
            it.print(cx,y,font,ink,TextAlign::TOP_CENTER,label.c_str());
          };
          line(90,a.name,id(ui_small));
          line(120,a.state,id(font_small));
          line(152,a.eta.empty()?"Ende: --":"ca. fertig "+a.eta,id(ui_small));
          if(a.progress>=0){
            const int bar_w=cell-14;
            it.rectangle(left+6,194,bar_w,9,ink);
            const int fill=int((bar_w-2)*a.progress/100.0f);
            if(fill>0)it.filled_rectangle(left+7,195,fill,7,ink);
          }
        }
      }
    }
    painted_analog=analog;clock_valid=true;
    id(screensaver_clock_full)=false;
    ESP_LOGI("screensaver_clock","%s: %s Bereich %d",analog?"Analog":"Digital",full?"FULL":"PARTIAL",part);
    return;
  }
  }
