        std::string d=e["d"] | "",state=e["s"] | "",kind=e["kind"] | "";
        const char* icon=d=="light"?"\U000F0335":d=="climate"?"\U000F0438":kind=="awning"?"\U000F07C7":"\U000F111C";
        center(cx+40,y+37,icon,id(mdi_home),INK);
        text(cx+78,y+13,e["n"] | "Gerät",id(font_lesson),INK,cw-95);
        std::string status;
        if(state=="unknown" || state=="unavailable" || state.empty())status="Nicht verfügbar";
        else if(d=="light"){
          status=state=="on"?"An":"Aus";
          if((e["dim"] | false) && !e["b"].isNull())status+=" · "+epaper_home::number(e["b"].as<float>())+" %";
        }else if(d=="cover"){
          status=state=="open"?"Offen":state=="closed"?"Geschlossen":state=="opening"?"Öffnet":state=="closing"?"Schließt":state;
          if(!e["p"].isNull())status+=" · "+epaper_home::number(e["p"].as<float>())+" % offen";
        }else{
          std::string unit=e["unit"] | "°C";
          status="Ist: "+(e["cur"].isNull()?std::string("—"):epaper_home::number(e["cur"].as<float>())+" "+unit);
          status+=" · Soll: "+(e["t"].isNull()?std::string("—"):epaper_home::number(e["t"].as<float>())+" "+unit);
          status+=" · "+(state=="heat"?std::string("Heizen"):state=="auto"?std::string("Auto"):state=="off"?std::string("Aus"):state);
        }
        text(cx+24,y+67,status,id(font_small),INK,cw-48);
        auto buttons=epaper_home::buttons(e);
        if(buttons.empty())continue;
        const int bw=(cw-40)/(int)buttons.size();
        for(int b=0;b<(int)buttons.size();b++){
