    ESP_LOGI("home_ui","Raum %s: %u Geraete -> %u Anzeigezeilen, Seite %d/%d (je %d Zeilen)",
             id(home_selected_room).c_str(),(unsigned)devices.size(),(unsigned)slots.size(),
             id(home_device_offset)/DEVICE_ROWS+1,last/DEVICE_ROWS+1,DEVICE_ROWS);
    // Only now replace the snapshot: the previous JSON must remain available
    // throughout the device-by-device diff above.
