      it.rectangle(l.right(),PAGER_TOP,l.card_width(),H-PAGER_TOP,PAPER);
    }
    if(last>0 && (right_changed || old_slots.size()!=slots.size())){
      if(home_partial && !right_changed){
        fast_rect(l.right(),PAGER_TOP,l.card_width(),H-PAGER_TOP,PAPER);
        it.rectangle(l.right(),PAGER_TOP,l.card_width(),H-PAGER_TOP,PAPER);
