        if(slot_index<(int)slots.size() || slot_index>=(int)old_slots.size())continue;
        const int x=l.right(),y=DEVICE_TOP+row*l.card_h,w=l.card_width();
        fast_rect(x-2,y-2,w+8,208,PAPER);
