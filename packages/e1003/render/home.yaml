  if(id(current_page)==1){
    // Room/floor dashboard inspired by HA's areas view. Only rooms with
    // supported control entities are shown, just like Haussteuerung.
    // Single 1872x1404 page: floor title + 6-column icon-card grid.
    const uint32_t overview_start=millis();
    id(home_overview_room_ids).clear();
    id(home_overview_hitboxes).clear();
    auto overview_doc=esphome::json::parse_json(id(home_rooms_json).state);
    if(overview_doc.isNull() || overview_doc.overflowed() || !overview_doc["rooms"].is<JsonArray>()){
      text(30,CONTENT_TOP+50,"Raumdaten fehlen – ${home_rooms_entity} / payload prüfen.",id(ui_body),INK,W-60);
      return;
    }
    JsonArray overview_rooms=overview_doc["rooms"].as<JsonArray>();
    auto canonical_floor=[](std::string f)->std::string{
      if(f=="Dachgeschoß")return "Dachgeschoss";
      if(f=="Obergeschoß")return "Obergeschoss";
      if(f=="Erdgeschoss")return "Erdgeschoß";
      if(f=="Untergeschoß" || f=="Kellergeschoss")return "Untergeschoss";
      return f.empty()?std::string("Ohne Etage"):f;
    };
    auto floor_of=[&](JsonObject r)->std::string{
      std::string f=r["floor"] | "";
      if(f.empty())f=r["floor_name"] | "";
      if(f.empty())f=r["etage"] | "";
      if(f.empty())f=r["f"] | "";
      return canonical_floor(f);
    };
    auto floor_rank=[](const std::string& f)->int{
      if(f=="Dachgeschoss")return 0;
      if(f=="Obergeschoss")return 1;
      if(f=="Erdgeschoß")return 2;
      if(f=="Untergeschoss")return 3;
      if(f=="Ohne Etage")return 99;
      return 50;
    };
    std::vector<int> visible;
    visible.reserve(overview_rooms.size());
    for(int i=0;i<(int)overview_rooms.size();i++){
      JsonObject r=overview_rooms[i].as<JsonObject>();
      JsonArray entities=r["entities"].as<JsonArray>();
      if(!entities.isNull() && entities.size()>0)visible.push_back(i);
    }
    std::stable_sort(visible.begin(),visible.end(),[&](int a,int b){
      JsonObject ra=overview_rooms[a].as<JsonObject>();
      JsonObject rb=overview_rooms[b].as<JsonObject>();
      const auto fa=floor_of(ra),fb=floor_of(rb);
      const int rank_a=floor_rank(fa),rank_b=floor_rank(fb);
      if(rank_a!=rank_b)return rank_a<rank_b;
      if(fa!=fb)return fa<fb;
      return std::string(ra["n"] | "")<std::string(rb["n"] | "");
    });
    struct FloorGroup {std::string name;std::vector<int> rooms;};
    std::vector<FloorGroup> groups;
    for(int i:visible){
      JsonObject r=overview_rooms[i].as<JsonObject>();
      const auto f=floor_of(r);
      if(groups.empty() || groups.back().name!=f)groups.push_back({f,{}});
      groups.back().rooms.push_back(i);
    }
    if(groups.empty()){
      text(30,CONTENT_TOP+50,"Keine steuerbaren Räume vorhanden.",id(ui_body),INK,W-60);
      return;
    }
    // Screenshot geometry: floor label then left-aligned, equal-width cards.
    // If a floor contains > 6 rooms it occupies more than one grid row.
    const int margin=64, gap_x=20, group_gap=12, header_h=52;
    const int cols=6;
    const int card_w=(W-2*margin-(cols-1)*gap_x)/cols;
    const int content_y=CONTENT_TOP+8, bottom=H-16;
    int rows=0;
    for(const auto &g:groups)rows+=((int)g.rooms.size()+cols-1)/cols;
    const int available=std::max(0,bottom-content_y-(int)groups.size()*header_h-
                                  std::max(0,(int)groups.size()-1)*group_gap);
    const int row_h=std::max(1,available/std::max(1,rows));
    const Color ICON_COLOR=INK; // Small room symbols need full black contrast.
    const Color CARD_BORDER(214,214,214);
    auto floor_icon=[](const std::string &f)->const char*{
      if(f=="Dachgeschoss")return "\U000F0D81"; // home-floor-2
      if(f=="Obergeschoss")return "\U000F0D80"; // home-floor-1
      if(f=="Erdgeschoß")return "\U000F0DD2"; // home-floor-0
      if(f=="Untergeschoss")return "\U000F0DD3"; // home-floor-negative-1
      return "\U000F02DC";
    };
    auto room_icon=[](JsonObject r)->const char*{
      const std::string id=r["id"] | "";
      const std::string name=r["n"] | "";
      if(id=="ankleide" || name=="Ankleide")return "\U000F0F91"; // wardrobe-outline
      if(id=="kleiderschrank" || name=="Kleiderschrank")return "\U000F0F90";
      if(id=="bad_dachgeschoss")return "\U000F1818"; // bathtub
      if(id=="bad_obergeschoss")return "\U000F09A1"; // shower-head
      if(id=="bad_erdgeschoss")return "\U000F09A1"; // shower-head fallback: faucet glyph absent in installed font
      if(id=="balkon" || name=="Balkon")return "\U000F1817";
      if(id=="garten" || name=="Garten")return "\U000F1510";
      if(id=="kuche" || name=="Küche")return "\U000F181C";
      if(id=="wohnzimmer" || name=="Wohnzimmer")return "\U000F04B9";
      if(id=="waschraum" || name=="Waschraum")return "\U000F072A";
      if(id=="dachgeschoss" || id=="elisa_zimmer" || id=="maxim_zimmer" ||
         id=="gastezimmer")return "\U000F02E3"; // bed
      if(id.find("flur")!=std::string::npos)return "\U000F0821"; // floor-plan
      std::string lower=name;
      std::transform(lower.begin(),lower.end(),lower.begin(),[](unsigned char c){return (char)std::tolower(c);});
      if(lower.find("bad")!=std::string::npos)return "\U000F09A1";
      if(lower.find("zimmer")!=std::string::npos)return "\U000F02E3";
      if(lower.find("flur")!=std::string::npos)return "\U000F0821";
      return "\U000F02DC"; // neutral home icon for future/new rooms
    };
    int y=content_y;
    for(const auto &group:groups){
      center(margin+24,y+header_h/2,floor_icon(group.name),id(mdi_room_floors),INK);
      text(margin+58,y+7,group.name,id(ui_title),INK,W-2*margin-58);
      y+=header_h;
      for(size_t index=0;index<group.rooms.size();index++){
        const int column=(int)index%cols;
        const int row=(int)index/cols;
        const int x=margin+column*(card_w+gap_x);
        const int card_y=y+row*row_h+3;
        const int card_h=std::max(1,row_h-8);
        JsonObject room=overview_rooms[group.rooms[index]].as<JsonObject>();
        // 8px corner chamfer: rounded-looking card outline without a slow
        // full-size rounded-pixel raster or a second framebuffer copy.
        const int radius=std::min(14,std::max(1,card_h/12));
        it.line(x+radius,card_y,x+card_w-radius,card_y,CARD_BORDER);
        it.line(x+radius,card_y+card_h-1,x+card_w-radius,card_y+card_h-1,CARD_BORDER);
        it.line(x,card_y+radius,x,card_y+card_h-radius,CARD_BORDER);
        it.line(x+card_w-1,card_y+radius,x+card_w-1,card_y+card_h-radius,CARD_BORDER);
        it.line(x,card_y+radius,x+radius,card_y,CARD_BORDER);
        it.line(x+card_w-radius,card_y,x+card_w-1,card_y+radius,CARD_BORDER);
        it.line(x,card_y+card_h-radius,x+radius,card_y+card_h-1,CARD_BORDER);
        it.line(x+card_w-radius,card_y+card_h-1,x+card_w-1,card_y+card_h-radius,CARD_BORDER);
        // Never wrap in the middle of a room name word. A single word
        // (e.g. Dachgeschoss / Kleiderschrank / Elisa-Zimmer) remains on
        // ONE line; select a smaller existing font if the normal one is too wide.
        // Two-word names (e.g. Bad Obergeschoss) may break at the space.
        center(x+card_w/2,card_y+std::min(72,card_h/3),room_icon(room),id(mdi_rooms),ICON_COLOR);
        std::string label=clean(room["n"] | "Raum");
        const int name_w=card_w-22;
        const int label_center=card_y+card_h-std::min(62,card_h/3);
        auto room_font=[&](const std::string &s){
          if(width(s,id(font_lesson))<=name_w)return id(font_lesson);
          if(width(s,id(font_small))<=name_w)return id(font_small);
          return id(font_meta);
        };
        if(width(label,id(font_lesson))<=name_w || label.find(' ')==std::string::npos){
          auto f=room_font(label);
          center(x+card_w/2,label_center,fit(label,f,name_w),f,INK);
        }else{
          // Break only on whitespace; do not use the general-purpose
          // pixel-based lines() helper, which also splits single words.
          const size_t split=label.find(' ');
          const std::string first=label.substr(0,split);
          const std::string second=label.substr(label.find_first_not_of(' ',split));
          auto f1=room_font(first),f2=room_font(second);
          center(x+card_w/2,label_center-18,fit(first,f1,name_w),f1,INK);
          center(x+card_w/2,label_center+19,fit(second,f2,name_w),f2,INK);
        }
        id(home_overview_room_ids).push_back(room["id"].as<std::string>());
        auto &b=id(home_overview_hitboxes);
        b.push_back(x);b.push_back(card_y);b.push_back(card_w);b.push_back(card_h);
      }
      y+=((int)group.rooms.size()+cols-1)/cols*row_h+group_gap;
    }
    ESP_LOGI("home_ui","Uebersicht: %u Etagen, %u Raeume, %d Rasterreihen, Kachel %dx%d, %u Hitboxen, Aufbau %u ms",
             (unsigned)groups.size(),(unsigned)visible.size(),rows,card_w,row_h-8,
             (unsigned)id(home_overview_room_ids).size(),(unsigned)(millis()-overview_start));
    return;
  }
  if(id(current_page)==9){
    // Day totals only. Cross lines from v4.0.9; complete redraw on entry/60min.
    auto doc=esphome::json::parse_json(id(energy_flow_json).state);
    const bool valid=!doc.isNull() && !doc.overflowed() && doc["pv"].is<JsonObject>();
    if(!valid){
      painted_energy_values.clear();
      text(30,CONTENT_TOP+30,"Energieverteilung",id(ui_title),INK,W-60);
      text(30,CONTENT_TOP+125,"Energiedaten fehlen: sensor.epaper_energy_flow / payload",id(ui_body),INK,W-60);
      return;
    }
    JsonObject pv=doc["pv"].as<JsonObject>();
    JsonObject grid=doc["grid"].as<JsonObject>();
    JsonObject battery=doc["battery"].as<JsonObject>();
    JsonObject home=doc["home"].as<JsonObject>();
    JsonObject gas=doc["gas"].as<JsonObject>();
    JsonObject water=doc["water"].as<JsonObject>();
    auto num=[](JsonVariant v,int decimals,const char *unit)->std::string{
      if(v.isNull())return "--";
      float f=v.as<float>();if(!std::isfinite(f))return "--";
      char b[64];snprintf(b,sizeof(b),"%.*f",decimals,(double)f);
      std::string out=b;for(char &c:out)if(c=='.')c=',';
      if(unit && *unit)out+=" "+std::string(unit);
      return out;
    };
    auto today=[&](JsonObject o,const char *key,const char *unit){
      return num(o[key].as<JsonVariant>(),2,unit);
    };
    const std::string pvv=today(pv,"energy_today","kWh");
    const std::string gasv=today(gas,"today","m³");
    const std::string inv=today(grid,"import_today","kWh");
    const std::string outv=today(grid,"export_today","kWh");
    const std::string homev=today(home,"energy_today","kWh");
    const std::string chargev=today(battery,"charge_today","kWh");
    const std::string dischargev=today(battery,"discharge_today","kWh");
    const std::string waterv=today(water,"today","m³");
    // Zendure battery icon reflects charge status when this hourly snapshot was created.
    const bool charging=!battery["charge_power"].isNull() &&
        battery["charge_power"].as<float>() > 15.0f &&
        battery["charge_power"].as<float>() > (battery["discharge_power"].isNull() ? 0.0f : battery["discharge_power"].as<float>()) + 10.0f;
    const bool cloudy_pv=!pv["energy_today"].isNull() &&
        pv["energy_today"].as<float>() < 0.1f;
    const std::string signature=pvv+"|"+gasv+"|"+inv+"|"+outv+"|"+
           homev+"|"+chargev+"|"+dischargev+"|"+waterv+"|"+(cloudy_pv?"CLOUD":"SUN")+"|"+(charging?"CHG":"IDLE");
    painted_energy_values=signature;
    const bool static_elements=true;
    const int cx_grid=310,cx_pv=935,cx_gas=1535;
    const int cx_batt=935,cx_home=1535,cx_water=1535;
    const int y_top=500,y_mid=865,y_bottom=1190;
    const int radius=118;
    const Color GRID_SHADE(120,120,120), PV_SHADE(90,90,90), GAS_SHADE(70,70,70),
                HOME_SHADE(105,105,105), BAT_SHADE(145,145,145), WATER_SHADE(135,135,135);
    // Simple orthogonal power-flow cross: no bezier curves or branch arcs.
    if(static_elements){
      text(40,CONTENT_TOP+22,"Energieverteilung",id(font_start_info),INK,W-80);
      auto line2=[&](int x0,int y0,int x1,int y1,Color shade){
        it.line(x0,y0,x1,y1,shade);
        if(x0==x1)it.line(x0+1,y0,x1+1,y1,shade);
        else it.line(x0,y0+1,x1,y1+1,shade);
      };
      // Main cross, reaching the node rings without drawing over icons or values.
      line2(cx_grid+radius,y_mid,cx_home-radius,y_mid,GRID_SHADE);
      line2(cx_pv,y_top+radius,cx_batt,y_bottom-radius,PV_SHADE);
      // Gas and water retain the simple vertical connections from the HA reference.
      line2(cx_gas,y_top+radius,cx_home,y_mid-radius,GAS_SHADE);
      line2(cx_home,y_mid+radius,cx_water,y_bottom-radius,WATER_SHADE);
    }
    struct EnergyNode {int x,y; const char *icon; const char *value1; const char *value2; Color stroke; bool dual;};
    const std::vector<EnergyNode> nodes={
      {cx_pv,y_top,cloudy_pv?"\U000F0595":"\U000F0A72",pvv.c_str(),"",PV_SHADE,false},
      {cx_gas,y_top,"\U000F0238",gasv.c_str(),"",GAS_SHADE,false},
      {cx_grid,y_mid,"\U000F0D3E",inv.c_str(),outv.c_str(),GRID_SHADE,true},
      {cx_home,y_mid,"\U000F02DC",homev.c_str(),"",HOME_SHADE,false},
      {cx_batt,y_bottom,charging?"\U000F0084":"\U000F0079",dischargev.c_str(),chargev.c_str(),BAT_SHADE,true},
      {cx_water,y_bottom,"\U000F058C",waterv.c_str(),"",WATER_SHADE,false}
    };
    for(auto &n:nodes){
      if(static_elements){
        for(int r=radius-2;r<=radius;r++)it.circle(n.x,n.y,r,n.stroke);
        center(n.x,n.y-44,n.icon,id(mdi_energy),INK);
      }
      if(n.dual){
        const std::string line1=std::string(n.x==cx_grid?"→":"↓")+n.value1;
        const std::string line2=std::string(n.x==cx_grid?"←":"↑")+n.value2;
        center(n.x,n.y+10,fit(line1,id(ui_small),178),id(ui_small),INK);
        center(n.x,n.y+48,fit(line2,id(ui_small),178),id(ui_small),INK);
      } else {
        center(n.x,n.y+27,fit(n.value1,id(ui_small),178),id(ui_small),INK);
        if(std::string(n.value2).size())center(n.x,n.y+52,fit(n.value2,id(ui_small),178),id(ui_small),INK);
      }
    }
    ESP_LOGI("energy_flow","Energie gerendert: PV %s; Haus %s; Gas %s; Wasser %s; Speicher %s",
            pvv.c_str(),homev.c_str(),gasv.c_str(),waterv.c_str(),charging?"LAEDT":"NORMAL");
    return;
  }
  if(id(current_page)==10){
    // Snapshot of direct HA subscriptions; never coerce missing values to zero.
    const bool connected=id(e1003).is_connected() && wifi::global_wifi_component->is_connected();
    auto reading=[&](auto *sensor)->float {
      return connected && sensor->has_state() && std::isfinite(sensor->state) ? sensor->state : NAN;
    };
    const float panels[7]={reading(id(sf800_pv1)),reading(id(sf800_pv2)),reading(id(sf800_pv3)),
      reading(id(deye_pv1)),reading(id(deye_pv2)),reading(id(deye_pv3)),reading(id(deye_pv4))};
    const float sf=panels[0]+panels[1]+panels[2];
    const float off=reading(id(solar_offgrid));
    const float deye=std::isfinite(off)?std::max(0.0f,-off):NAN;
    const float total=sf+deye, house=reading(id(solar_house));
    auto watts=[](float v,bool sign=false)->std::string {
      if(!std::isfinite(v))return "-- W";
      char b[40];snprintf(b,sizeof(b),sign?"%+.0f W":"%.0f W",(double)v);return b;
    };
    static std::string cached[14];
    auto changed=[&](int slot,const std::string &key){
      bool repaint=!solar_partial || cached[slot]!=key;cached[slot]=key;return repaint;
    };
    const int margin=40,gap=28,half=(W-2*margin-gap)/2;
    const int summary_y=CONTENT_TOP+100, summary_h=210;
    const int systems_y=summary_y+summary_h+38, systems_h=H-systems_y-95;
    if(!solar_partial){
      text(margin,CONTENT_TOP+14,"Solar · aktuelle Leistung",id(font_start_info),INK,W-80);
      for(int col=0;col<2;col++){
        int x=margin+col*(half+gap);
        it.rectangle(x,summary_y,half,summary_h,MID);
        it.rectangle(x,systems_y,half,systems_h,MID);
      }
      text(margin+24,summary_y+16,"SOLAR GESAMT",id(ui_small),INK,half-48);
      text(margin+half+gap+24,summary_y+16,"HAUS · NETZBILANZ",id(ui_small),INK,half-48);
      text(margin+24,summary_y+166,"3 Paneele + Deye am Off-grid-Port",id(ui_small),INK,half-48);
      text(margin+half+gap+24,summary_y+166,"+ Bezug / - Einspeisung",id(ui_small),INK,half-48);
      text(margin+24,systems_y+20,"SolarFlow 800 Pro",id(font_start_info),INK,half-48);
      text(margin+half+gap+24,systems_y+20,"Deye M200g4",id(font_start_info),INK,half-48);
      text(margin+24,systems_y+135,"Eingaenge 1 bis 3 · DC-Leistung",id(ui_small),INK,half-48);
      text(margin+half+gap+24,systems_y+135,"SolarFlow 2400 AC+ · Off-grid",id(ui_small),INK,half-48);
      text(margin+24,systems_y+systems_h-60,"Panel 4 nicht belegt",id(ui_small),DARK,half-48);
      text(margin+half+gap+24,systems_y+systems_h-60,"Panelwerte werden nicht doppelt addiert",id(ui_small),DARK,half-48);
    }
    const float values[4]={total,house,sf,deye};
    for(int i=0;i<4;i++){
      int x=margin+(i%2)*(half+gap)+24;
      int y=i<2?summary_y+64:systems_y+77;
      std::string label=watts(values[i],i==1);
      if(changed(i,label)){
        fast_rect(x,y,half-48,i<2?96:52,PAPER);
        text(x,y,label,i<2?id(font_start_weather):id(font_start_info),INK,half-48);
      }
    }
    // Shared adaptive scale: all seven bars use the same W range.
    float peak=100.0f;for(float v:panels)if(std::isfinite(v))peak=std::max(peak,v);
    const float scale=std::ceil(peak/100.0f)*100.0f;
    const int row_h=(systems_h-255)/4;
    for(int i=0;i<7;i++){
      int col=i<3?0:1,row=i<3?i:i-3;
      int x=margin+col*(half+gap)+24,y=systems_y+200+row*row_h;
      std::string label=watts(panels[i]);
      std::string key=label+"/"+watts(scale);
      if(changed(4+i,key)){
        fast_rect(x,y,half-48,row_h-8,PAPER);
        text(x,y,"PV "+std::to_string(row+1),id(ui_body),INK,150);
        text(x+half-280,y,label,id(ui_body),INK,230);
        fast_rect(x,y+52,half-48,22,LIGHT);
        if(std::isfinite(panels[i])){
          int bw=(int)((half-48)*std::max(0.0f,panels[i])/scale);
          fast_rect(x,y+52,bw,22,col==0?INK:DARK);
        }
      }
    }
    std::string status=connected?"Anzeige ":"HA offline · ";
    status+=now.is_valid()?now.strftime("%H:%M"):"--:--";
    status+=" · 60 s · Balkenskala 0–"+watts(scale);
    if(!std::isfinite(total) || !std::isfinite(house))status+=" · Messwerte fehlen";
    if(changed(11,status)){
      fast_rect(margin,H- 65,W-80,48,PAPER);
      text(margin,H- 65,status,id(ui_small),INK,W-80);
    }
    ESP_LOGI("solar", "Gesamt=%s; SF800=%s; Deye Off-grid=%s; Netzbilanz=%s",
      watts(total).c_str(),watts(sf).c_str(),watts(deye).c_str(),watts(house,true).c_str());
    return;
  }
