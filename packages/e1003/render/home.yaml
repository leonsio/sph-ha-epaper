    painted_home_sidebar_signature=sidebar_signature;
    painted_home_room_offset=id(home_room_offset);
    painted_home_device_offset=id(home_device_offset);
    painted_home_message=id(home_message);
    ESP_LOGD("home_timing","Home: %s, Geraetekarten: %u ms, %u Entitaeten im Raum, Offset %d",
             home_partial?"PARTIAL":"FULL",(unsigned)(millis()-home_cards_begin),(unsigned)devices.size(),id(home_device_offset));
    return;
