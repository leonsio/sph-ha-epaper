  initial_value: '""'
- id: home_waiting_state
  type: bool
  restore_value: false
  initial_value: 'false'
# Bitmask persists across reset/deep sleep. 0x1F: all tabs on by default.
# Start=0x1, Home=0x2, Maxim=0x4, Wetter=0x8, Elisa=0x10.
- id: nav_visibility_mask
  type: uint32_t
  restore_value: true
  initial_value: '31'
# One-time migration for devices whose four-tab visibility mask is already saved.
- id: nav_elisa_initialized
  type: bool
  restore_value: true
  initial_value: 'false'
- id: elisa_last_minute
  type: int64_t
  restore_value: false
  initial_value: '-1'
- id: elisa_partial_refresh
  type: bool
  restore_value: false
  initial_value: 'false'
- id: maxim_partial_refresh
  type: bool
  restore_value: false
  initial_value: 'false'
# 0 = normal; 5 = EIN gemeinsamer Snapshot fuer Uhr und Countdown (eine Display-Transaktion).
- id: maxim_time_part
  type: int
  restore_value: false
  initial_value: '0'
# Recorded only after drawing the static Maxim page; minute countdown reads cached timestamp.
- id: maxim_last_minute_key
  type: int64_t
  restore_value: false
  initial_value: '-1'
# Zeitstempel des ausloesenden Minutenwechsels: im Renderer NICHT erneut now() lesen.
- id: maxim_tick_epoch
