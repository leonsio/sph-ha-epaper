globals:
- id: screensaver_enabled
  type: bool
  restore_value: true
  initial_value: 'false'
- id: screensaver_redraw
  type: bool
  restore_value: false
  initial_value: 'false'
- id: screensaver_waking
  type: bool
  restore_value: false
  initial_value: 'false'
- id: home_pending_entity
