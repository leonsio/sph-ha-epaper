- platform: wifi_signal
  id: wifi_rssi
  name: WiFi Signal
  update_interval: 60min
  internal: true
  on_value:
    then:
    - lambda: |-
        // RSSI itself may vary every minute without changing the visible icon.
        // Refresh only when the displayed 0..4 bar level actually changes.
        int level = !std::isfinite(x) ? 0 : (x >= -55 ? 4 : x >= -65 ? 3 : x >= -75 ? 2 : 1);
        if (level != id(observed_wifi_level)) {
          ESP_LOGD("status_timing", "WiFi-Anzeige geändert: %d -> %d (RSSI %.0f dBm)", id(observed_wifi_level), level, x);
          id(observed_wifi_level) = level;
          id(status_dirty) = true;
        }
- platform: adc
  pin: GPIO1
  name: Battery Voltage
  id: battery_voltage
  device_class: voltage
  unit_of_measurement: V
  state_class: measurement
  accuracy_decimals: 2
  entity_category: diagnostic
  attenuation: 12db
  update_interval: 60min
  on_value:
    then:
    - lambda: ESP_LOGD("grid_timing", "Batteriespannung gemessen");
  filters:
  - multiply: 2.0
- platform: template
  name: Battery
  id: battery_level
  device_class: battery
  unit_of_measurement: '%'
  state_class: measurement
  accuracy_decimals: 0
  entity_category: diagnostic
  lambda: return id(battery_voltage).state;
  update_interval: 60min
  filters:
  - calibrate_linear:
    - 4.15 -> 100.0
    - 3.96 -> 90.0
    - 3.91 -> 80.0
    - 3.85 -> 70.0
    - 3.80 -> 60.0
    - 3.75 -> 50.0
    - 3.68 -> 40.0
    - 3.58 -> 30.0
    - 3.49 -> 20.0
    - 3.41 -> 10.0
    - 3.30 -> 5.0
    - 3.27 -> 0.0
  - clamp:
      min_value: 0
      max_value: 100
  on_value:
    then:
    - lambda: id(status_dirty) = true;
# Runtime control exposed in Home Assistant. State survives deep-sleep boot cycles.
# OFF cancels the inactivity timer AND prevents accidental deep_sleep.enter.
