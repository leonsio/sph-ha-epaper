# JSON payload is generated by the accompanying Home Assistant package.
- platform: homeassistant
  id: elisa_rmv_json
  entity_id: ${elisa_rmv_entity}
  attribute: payload
  internal: true
  on_value:
    then:
    - lambda: |-
        id(dirty_pages) |= (1U << 11);
        // Cache incoming data, but do not even start the debounce script for
        // hidden pages/screensavers. The 5s poll retries dirty data while busy.
        if(!id(sd_photos).active() && !id(sd_photos).resume_requested() && id(current_page)==11 &&
           id(initial_render_done) && !id(refresh_busy))id(elisa_refresh).execute();
- platform: template
  id: e1003_active_page
  name: E1003 Aktive Seite
  update_interval: never
  icon: mdi:page-layout-body
  # 8 = Haussteuerung, 9 = Energie. Nur bei Seitenwechsel/Boot senden.
- platform: homeassistant
  id: start_dashboard_json
  entity_id: ${start_dashboard_entity}
  attribute: payload
  internal: true
  on_value:
    then:
    - lambda: |-
        id(dirty_pages) |= 1U;
        if(!id(sd_photos).active() && !id(sd_photos).resume_requested() && id(current_page)==0 &&
           id(initial_render_done) && !id(refresh_busy))id(start_refresh).execute();
- platform: homeassistant
  id: home_rooms_json
  entity_id: ${home_rooms_entity}
  attribute: payload
  internal: true
  on_value:
    then:
    - lambda: |-
        id(dirty_pages) |= 1U;
        if(!id(sd_photos).active() && !id(sd_photos).resume_requested() &&
           id(current_page)==0 && id(initial_render_done) && !id(refresh_busy))id(start_refresh).execute();
        // A service acknowledgement is not a device-state acknowledgement.
        if(!id(home_pending_entity).empty()) {
          auto feedback=esphome::json::parse_json(x);
          if(!feedback.isNull() && !feedback.overflowed()) {
            JsonArray feedback_rooms=feedback["rooms"].as<JsonArray>();
            for(JsonObject room:feedback_rooms) {
              JsonArray entities=room["entities"].as<JsonArray>();
              for(JsonObject e:entities) {
                if(e["id"].as<std::string>()!=id(home_pending_entity))continue;
                std::string current;serializeJson(e,current);
                ESP_LOGI("home_ui","Rueckmeldung %s: Zustand=%s; Daten=%s",
                         id(home_pending_entity).c_str(),e["s"] | "?",
                         current==id(home_pending_before)?"unveraendert":"geaendert");
                if(id(home_waiting_state) && current!=id(home_pending_before)) {
                  id(home_waiting_state)=false;
                  id(home_message)="Gerätestatus von Home Assistant aktualisiert.";
                }
              }
            }
          }
        }
        // Track only Home room/device STRUCTURE, not changing entity state.
        // Thus the overview repaints when devices are added/removed (or initially
        // arrive late), but not every 5s for a light/thermostat state change.
        std::string structure;
        auto overview_doc=esphome::json::parse_json(x);
        if(!overview_doc.isNull() && !overview_doc.overflowed() && overview_doc["rooms"].is<JsonArray>()){
          JsonArray overview_rooms = overview_doc["rooms"].as<JsonArray>();
          for(JsonObject room : overview_rooms){
            structure+=room["id"].as<std::string>()+"|"+(room["n"] | "")+"|"+(room["floor"] | "")+"|";
            JsonArray entities = room["entities"].as<JsonArray>();
            for(JsonObject e : entities) structure+=e["id"].as<std::string>()+",";
            structure+=";";
          }
        }
        const bool overview_changed=structure!=id(home_overview_structure);
        id(home_overview_structure)=structure;
        if(overview_changed)id(dirty_pages) |= (1U << 1);
        id(dirty_pages) |= (1U << 8);
        ESP_LOGD("home_ui", "Raumdaten empfangen: %u Bytes; Struktur %s", (unsigned)x.size(),overview_changed?"geändert":"gleich");
        if(overview_changed && id(current_page)==1 && id(initial_render_done) && !id(refresh_busy))
          id(refresh_display).execute();
    - if:
        condition:
          lambda: return !id(sd_photos).active() && id(current_page)==8;
        then:
        - script.execute: home_refresh
# Home Assistant package: /config/packages/epaper_energy_package.yaml
- platform: homeassistant
  id: energy_flow_json
  entity_id: sensor.epaper_energy_flow
  attribute: payload
  internal: true
  on_value:
    then:
    - lambda: |-
        // On entering the energy page, the HA payload can arrive after the
        // first page paint. Mark only then; the usual 60min timer handles later updates.
        if(id(current_page)==9){
          id(dirty_pages) |= (1U << 9);
          if(id(initial_render_done) && !id(refresh_busy)) id(refresh_from_ha).execute();
        }
        ESP_LOGD("energy_flow", "Energy-JSON %u Bytes empfangen", (unsigned)x.size());
