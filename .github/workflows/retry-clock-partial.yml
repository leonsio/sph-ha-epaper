name: Retry clock partial refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retry-clock-partial.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refined clock patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/finalize-clock-partial.yml').read_text(encoding='utf-8')
          begin = "          python3 - <<'PY'\n"
          start = wf.index(begin) + len(begin)
          end = wf.index("          PY\n", start)
          lines = wf[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply_clock_patch.py').write_text(code, encoding='utf-8')
          PY
          python3 /tmp/apply_clock_patch.py

          # The generated C++ block ends with the outer brace. Keep that brace
          # inside the YAML literal (minimum four-space content indentation).
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sph-reterminal-e1003.yaml')
          s = p.read_text(encoding='utf-8')
          marker = "  lambda: |\n    if(id(sd_photos).active()){"
          start = s.index(marker) + len("  lambda: |\n")
          end_marker = "    // Native 1872 x 1404 renderer. No old page or centered 800 x 480 canvas.\n"
          end = s.index(end_marker, start)
          block = s[start:end]
          if not block.endswith("  }\n"):
              raise SystemExit('clock renderer does not end with expected two-space brace')
          block = block[:-4] + "    }\n"
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate ESPHome configuration
        shell: bash
        run: |
          cat > secrets.yaml <<'EOF'
          API: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          wifi_ssid: "compile-test"
          wifi_password: "compile-test-password"
          EOF
          python3 -m pip install --disable-pip-version-check --quiet "esphome==2026.9.0"
          esphome config sph-reterminal-e1003.yaml >/tmp/esphome-config.txt
          tail -n 25 /tmp/esphome-config.txt

      - name: Compile firmware
        shell: bash
        run: esphome compile sph-reterminal-e1003.yaml

      - name: Commit validated changes
        shell: bash
        run: |
          rm -f secrets.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-clock-partial.yml .github/workflows/retry-clock-partial.yml
          git add sph-reterminal-e1003.yaml components/sd_screensaver/sd_screensaver.h components/sd_screensaver/sd_screensaver.cpp
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Keep clock screensaver partial updates across sleep"
          git push origin HEAD:main
