name: Fix clock black partial refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-clock-black-refresh.yml

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use GC16 for clock dirty regions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sph-reterminal-e1003.yaml')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ('# Clock screensavers: minute changes use DU dirty-region updates; full GC16 only for initial/hourly/date refresh.',
             '# Clock screensavers: minute changes use GC16 dirty-region updates; full-panel GC16 only for initial/hourly/date refresh.'),
            ('"Uhr: PARTIAL DU fuer geaenderte Ziffer/Zeiger"',
             '"Uhr: PARTIAL GC16 fuer geaenderte Ziffer/Zeiger"'),
            ('"Uhr PARTIAL DU abgeschlossen"',
             '"Uhr PARTIAL GC16 abgeschlossen"'),
          ]
          for old,new in replacements:
              if s.count(old)!=1:
                  raise SystemExit(f'expected exactly one occurrence: {old!r}, got {s.count(old)}')
              s=s.replace(old,new,1)
          old='''  - if:\n      condition:\n        lambda: return id(screensaver_clock_partial) && id(screensaver_source).current_option()!="Bild";\n      then:\n      - it8951.update:\n          id: epaper\n          mode: DU\n      else:\n      - it8951.update:\n          id: epaper\n          mode: GC16\n'''
          new='''  - if:\n      condition:\n        lambda: return id(screensaver_clock_partial) && id(screensaver_source).current_option()!="Bild";\n      then:\n      # GC16 still uses the IT8951 dirty rectangle here; only the changed digit/hand\n      # region is transferred, but black is driven with the stable grayscale waveform.\n      - it8951.update:\n          id: epaper\n          mode: GC16\n      else:\n      - it8951.update:\n          id: epaper\n          mode: GC16\n'''
          if s.count(old)!=1:
              raise SystemExit(f'clock partial update block occurrence count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Prepare validation environment
        shell: bash
        run: |
          printf 'API: "' > secrets.yaml
          openssl rand -base64 32 | tr -d '\n' >> secrets.yaml
          printf '"\nwifi_ssid: "compile-test"\nwifi_password: "compile-test-password"\n' >> secrets.yaml
          python3 -m pip install --disable-pip-version-check --quiet "esphome==2026.9.0"
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re, shutil, urllib.request
          text=Path('sph-reterminal-e1003.yaml').read_text(encoding='utf-8')
          for raw in re.findall(r'^\s*file:\s*([^#\n]+\.png)\s*$',text,re.M | re.I):
              p=Path(raw.strip().strip('"\''))
              if not p.exists():
                  p.parent.mkdir(parents=True,exist_ok=True)
                  Image.new('RGB',(64,64),'white').save(p)
          for raw in re.findall(r'^\s*(?:-\s*)?file:\s*([^#\n]+\.ttf)\s*$',text,re.M | re.I):
              p=Path(raw.strip().strip('"\''))
              if p.exists():
                  continue
              p.parent.mkdir(parents=True,exist_ok=True)
              if 'MaterialDesignIcons' in p.name:
                  urllib.request.urlretrieve('https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf', p)
              else:
                  shutil.copy('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', p)
          PY

      - name: Validate ESPHome configuration
        run: esphome config sph-reterminal-e1003.yaml

      - name: Compile firmware
        run: esphome compile sph-reterminal-e1003.yaml

      - name: Commit fix
        shell: bash
        run: |
          rm -f secrets.yaml
          git clean -fd icons/ fonts/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-clock-black-refresh.yml
          git add sph-reterminal-e1003.yaml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Keep clock partial refresh black stable"
          git push origin HEAD:main
