name: Finalize validated clock partial refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-clock-partial-valid.yml

permissions:
  contents: write

jobs:
  validate-compile-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refined clock patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/finalize-clock-partial.yml').read_text(encoding='utf-8')
          begin = "          python3 - <<'PY'\n"
          start = wf.index(begin) + len(begin)
          end = wf.index("          PY\n", start)
          lines = wf[start:end].splitlines()
          Path('/tmp/p.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in lines)+'\n', encoding='utf-8')
          PY
          python3 /tmp/p.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sph-reterminal-e1003.yaml'); s=p.read_text(encoding='utf-8')
          m="  lambda: |\n    if(id(sd_photos).active()){"
          a=s.index(m)+len("  lambda: |\n")
          z=s.index("    // Native 1872 x 1404 renderer. No old page or centered 800 x 480 canvas.\n",a)
          b=s[a:z]
          if not b.endswith("  }\n"):
              raise SystemExit('unexpected clock renderer ending')
          b=b[:-4]+"    }\n"
          p.write_text(s[:a]+b+s[z:],encoding='utf-8')
          PY

      - name: Prepare validation environment
        shell: bash
        run: |
          printf 'API: "' > secrets.yaml
          openssl rand -base64 32 | tr -d '\n' >> secrets.yaml
          printf '"\nwifi_ssid: "compile-test"\nwifi_password: "compile-test-password"\n' >> secrets.yaml
          python3 -m pip install --disable-pip-version-check --quiet "esphome==2026.9.0"
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re
          text=Path('sph-reterminal-e1003.yaml').read_text(encoding='utf-8')
          for raw in re.findall(r'^\s*file:\s*([^#\n]+\.png)\s*$',text,re.M | re.I):
              p=Path(raw.strip().strip('"\''))
              if not p.exists():
                  p.parent.mkdir(parents=True,exist_ok=True)
                  Image.new('RGB',(64,64),'white').save(p)
                  print(f'temporary asset: {p}')
          PY

      - name: Validate ESPHome configuration
        shell: bash
        run: esphome config sph-reterminal-e1003.yaml

      - name: Compile firmware
        shell: bash
        run: esphome compile sph-reterminal-e1003.yaml

      - name: Commit validated source
        shell: bash
        run: |
          rm -f secrets.yaml
          git clean -fd icons/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-clock-partial.yml \
                 .github/workflows/retry-clock-partial.yml \
                 .github/workflows/diagnose-clock-partial.yml \
                 .github/workflows/finalize-clock-partial-valid.yml
          git add sph-reterminal-e1003.yaml components/sd_screensaver/sd_screensaver.h components/sd_screensaver/sd_screensaver.cpp
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Keep clock screensaver partial updates across sleep"
          git push origin HEAD:main
