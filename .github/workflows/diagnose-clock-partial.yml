name: Diagnose clock partial refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-clock-partial.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce patched tree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/finalize-clock-partial.yml').read_text(encoding='utf-8')
          begin = "          python3 - <<'PY'\n"
          start = wf.index(begin) + len(begin)
          end = wf.index("          PY\n", start)
          lines = wf[start:end].splitlines()
          Path('/tmp/p.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in lines)+'\n', encoding='utf-8')
          PY
          python3 /tmp/p.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sph-reterminal-e1003.yaml'); s=p.read_text(encoding='utf-8')
          m="  lambda: |\n    if(id(sd_photos).active()){"
          a=s.index(m)+len("  lambda: |\n")
          z=s.index("    // Native 1872 x 1404 renderer. No old page or centered 800 x 480 canvas.\n",a)
          b=s[a:z]
          if b.endswith("  }\n"): b=b[:-4]+"    }\n"
          s=s[:a]+b+s[z:]; p.write_text(s,encoding='utf-8')
          PY
      - name: Print ESPHome validation result
        shell: bash
        run: |
          cat > secrets.yaml <<'EOF'
          API: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          wifi_ssid: "compile-test"
          wifi_password: "compile-test-password"
          EOF
          python3 -m pip install --disable-pip-version-check --quiet "esphome==2026.9.0"
          set +e
          esphome config sph-reterminal-e1003.yaml > /tmp/result.txt 2>&1
          rc=$?
          cat /tmp/result.txt
          echo "ESPHOME_CONFIG_EXIT=$rc"
          exit 0
