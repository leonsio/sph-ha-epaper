name: Bootstrap ESPHome YAML

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct YAML
        shell: bash
        run: |
          if [ ! -f .bootstrap/chunk05.b64 ]; then
            echo "Bootstrap chunks not complete; nothing to do."
            exit 0
          fi
          cat .bootstrap/chunk*.b64 | tr -d '\r\n\t ' | base64 -d > /tmp/sph-trmnl.yaml.gz
          gzip -dc /tmp/sph-trmnl.yaml.gz > sph-trmnl-7.5-diy.yaml
          test "$(wc -c < sph-trmnl-7.5-diy.yaml)" -eq 142523
          rm -rf .bootstrap
      - name: Commit reconstructed file
        shell: bash
        run: |
          if [ ! -f sph-trmnl-7.5-diy.yaml ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sph-trmnl-7.5-diy.yaml
          git add -A .bootstrap || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add ESPHome configuration"
          git push
