      auto cal=parse_json(id(maxim_calendar_json).state);
      JsonObject attrs=timetable.as<JsonObject>();
      auto raw_text=[&](JsonVariant v)->std::string{if(v.isNull())return "";if(v.is<const char*>())return v.as<std::string>();if(v.is<int>())return std::to_string(v.as<int>());return "";};
      // Official Hessian holiday dates, first/last day inclusive. Weekend at start
      // of a Monday holiday belongs to the displayed break, not to the countdown.
      struct Holiday{const char*name;int y,m,d,ey,em,ed;};
      static const Holiday official[]={
        {"Herbstferien",2026,10,5,2026,10,17},
        {"Weihnachtsferien",2026,12,23,2027,1,12},
        {"Osterferien",2027,3,22,2027,4,2},
        {"Sommerferien",2027,6,28,2027,8,6},
        {"Herbstferien",2027,10,4,2027,10,16},
        {"Weihnachtsferien",2027,12,23,2028,1,11},
        {"Osterferien",2028,4,3,2028,4,14},
        {"Sommerferien",2028,7,3,2028,8,11},
        {"Herbstferien",2028,10,9,2028,10,20},
        {"Weihnachtsferien",2028,12,27,2029,1,12},
        {"Osterferien",2029,3,29,2029,4,13},
        {"Sommerferien",2029,7,16,2029,8,24},
        {"Herbstferien",2029,10,15,2029,10,26},
        {"Weihnachtsferien",2029,12,24,2030,1,11},
        {"Osterferien",2030,4,8,2030,4,22},
        {"Sommerferien",2030,7,22,2030,8,30}
      };
      struct Break{std::string name;int64_t start,end,official_start;bool active;};
      Break next_break{"",-1,-1,-1,false};
      auto break_for=[&](const Holiday&h){
        const int64_t start=civil(h.y,h.m,h.d),end=civil(h.ey,h.em,h.ed);
        // Saturday before a Monday: zero days until holidays on Saturday.
        const int64_t effective=start-(weekday(start)==0?2:(weekday(start)==6?1:0));
        int64_t effective_end=end;
        while(weekday(effective_end)==4||weekday(effective_end)==5)effective_end++;
        return Break{h.name,effective,effective_end,start,today_day>=effective&&today_day<=effective_end};
      };
      for(const Holiday&h:official){Break b=break_for(h);
        if(b.end<today_day)continue;
        if(next_break.start<0||b.start<next_break.start)next_break=b;
      }
      auto free_day=[&](int64_t d){
        if(weekday(d)>=5)return true;
        for(const Holiday&h:official){Break b=break_for(h);if(d>=b.start&&d<=b.end)return true;}
        if(attrs["freie_tage"].is<JsonArray>()){
          JsonArray a=attrs["freie_tage"].as<JsonArray>();
          for(JsonVariant v:a)if(raw_text(v)==iso_date(d))return true;
        }
        return false;
      };
      int first_start=475; // KFG normal first period: 07:55; replaced by actual first lesson.
      auto week_type=[&](int64_t date){
        std::string type=raw_text(attrs["wochenkennung"]);
        int64_t anchor=parse_date(raw_text(attrs["wochenbeginn"]));
        if(anchor>=0&&(type=="A"||type=="B")){
          int64_t m1=date-weekday(date),m0=anchor-weekday(anchor);
          if((std::abs(int((m1-m0)/7))%2)!=0)type=type=="A"?"B":"A";
        }
        return type;
      };
      auto lesson_visible=[&](JsonObject l,JsonArray day,const std::string&week){
        auto badges=[&](JsonObject obj){std::string out;
          if(obj["badge"].is<JsonArray>()){JsonArray a=obj["badge"].as<JsonArray>();for(JsonVariant v:a)out+=" "+raw_text(v)+" ";}
          else out=" "+raw_text(obj["badge"])+" ";
          return out;
        };
        std::string b=badges(l);bool a=b.find(" A ")!=std::string::npos,bb=b.find(" B ")!=std::string::npos;
        if(a||bb)return (week=="A"&&a)||(week=="B"&&bb);
        if(week=="A"||week=="B")for(JsonObject other:day){
          if(raw_text(other["index"])!=raw_text(l["index"])||raw_text(other["start"])!=raw_text(l["start"]))continue;
