        cache[slot]=key;fast_rect(x,y,w,h,PAPER);it.rectangle(x,y,w,h,MID);return true;
      };
      // Balanced two-column layout; keep timetable and tasks on the left.
      const int lx=20,lw=906,rx=946,rw=W-rx-20;
      const int y=CONTENT_TOP+6,top_h=300;
      std::string title=(today_school?"Heutiger Schultag": "Nächster Schultag");
      static const char *school_weekdays[]={"Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"};
      const std::string weekday_label=school_weekdays[weekday(target)];
      const std::string day_label=weekday_label+" - "+short_date(target)+" - "+week_type(target)+"-Woche";
      // The daily forecast uses the selected school DATE, never blindly tomorrow.
      std::string forecast_condition,forecast_date;
      float forecast_high=NAN,forecast_low=NAN;
      auto daily_doc=esphome::json::parse_json(id(epaper_weather_daily).state.empty()||
          id(epaper_weather_daily).state=="unknown"||id(epaper_weather_daily).state=="unavailable"
          ?"[]":id(epaper_weather_daily).state);
      if(!daily_doc.isNull()&&!daily_doc.overflowed()&&daily_doc.is<JsonArray>()){
        JsonArray days=daily_doc.as<JsonArray>();
        const std::string wanted=iso_date(target);
        for(JsonObject d:days){
          std::string dt=raw_text(d["datetime"]);
          if(dt.size()<10||dt.substr(0,10)!=wanted)continue;
          forecast_date=dt.substr(0,10);
          forecast_condition=raw_text(d["condition"]);
          JsonVariant hi=d["high"].isNull()?d["temperature"]:d["high"];
          JsonVariant lo=d["low"].isNull()?d["templow"]:d["low"];
          if(hi.is<float>()||hi.is<double>()||hi.is<int>())forecast_high=hi.as<float>();
          if(lo.is<float>()||lo.is<double>()||lo.is<int>())forecast_low=lo.as<float>();
