      condition:
        lambda: return id(home_waiting_state);
      then:
      - lambda: |-
          id(home_message)="Noch keine Zustandsänderung bestätigt – HA-Gerätestatus prüfen.";
          ESP_LOGW("home_ui","Keine Zustandsaenderung fuer %s nach 20 s; keine lokale Statusannahme",id(home_pending_entity).c_str());
      - script.execute: home_refresh
# A tap only requests a state change; item removal follows the updated HA payload.
- id: shopping_complete
  mode: single
  parameters:
    item_uid: string
    item_name: string
  then:
  - lambda: |-
      ESP_LOGI("shopping", "Einkauf abhaken: %s (UID=%s)", item_name.c_str(), item_uid.c_str());
