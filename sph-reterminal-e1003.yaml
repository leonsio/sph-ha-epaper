- id: home_command
  mode: single
  parameters:
    entity: string
    operation: string
    value: string
  then:
  - lambda: |-
      id(home_pending_entity)=entity;
      id(home_pending_before).clear();
      auto snapshot=esphome::json::parse_json(id(home_rooms_json).state);
      if(!snapshot.isNull() && !snapshot.overflowed()) {
        JsonArray rooms=snapshot["rooms"].as<JsonArray>();
        for(JsonObject room:rooms) {
          JsonArray entities=room["entities"].as<JsonArray>();
          for(JsonObject e:entities)if(e["id"].as<std::string>()==entity)
            serializeJson(e,id(home_pending_before));
        }
      }
      id(home_waiting_state)=true;
      id(home_message)="Befehl wird gesendet …";
      ESP_LOGI("home_ui", "Bedienung: %s / %s / %s", entity.c_str(), operation.c_str(), value.c_str());
  - script.execute: home_feedback_timeout
  - homeassistant.action:
      action: script.epaper_home_control
      data:
        entity: !lambda return entity;
        operation: !lambda return operation;
        value: !lambda return value;
      on_success:
      - lambda: |-
          if(id(home_waiting_state))id(home_message)="Befehl übergeben; warte auf Gerätestatus.";
          ESP_LOGI("home_ui", "Home Assistant hat den Befehl angenommen");
      - script.execute: home_refresh
      on_error:
      - lambda: |-
          id(home_waiting_state)=false;
          id(home_message)="Befehl fehlgeschlagen – Verbindung und Freigabe prüfen.";
          ESP_LOGW("home_ui", "Home Assistant Aktion fehlgeschlagen");
      - script.execute: home_refresh
  - script.execute: home_refresh
- id: publish_wake_diagnostics
  mode: single
  then:
  - delay: 250ms
  - if:
      condition:
        lambda: return !id(wake_diag_published) && id(wake_api_ms) > 0 && id(wake_display_ms) > 0;
      then:
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t wifi_ms = id(wake_wifi_ms);
          const uint32_t api_ms = id(wake_api_ms);
          const uint32_t display_ms = id(wake_display_ms);
          ESP_LOGI("wake_history", "================ WAKE DIAGNOSE ================");
          ESP_LOGI("wake_history", "Boot #%u | Ursache: %s | cause=%d | EXT1=0x%llX",
                   (unsigned) id(wake_boot_count), id(wake_cause_text).c_str(), id(wake_cause_code),
                   (unsigned long long) id(wake_ext1_mask));
          ESP_LOGI("wake_history", "Wake -> WLAN: %u ms | API: %u ms | Display: %u ms | jetzt: %u ms",
                   (unsigned) wifi_ms, (unsigned) api_ms, (unsigned) display_ms, (unsigned) now);
          ESP_LOGI("wake_history", "API-Client: %s", id(wake_api_client).empty() ? "noch unbekannt" : id(wake_api_client).c_str());
          ESP_LOGI("wake_history", "=================================================");
          id(wake_last_cause).publish_state(id(wake_cause_text));
          id(wake_api_client_sensor).publish_state(id(wake_api_client));
          id(wake_boot_count_sensor).publish_state((float) id(wake_boot_count));
          if (wifi_ms > 0) id(wake_wifi_time_sensor).publish_state((float) wifi_ms);
          if (api_ms > 0) id(wake_api_time_sensor).publish_state((float) api_ms);
          if (display_ms > 0) id(wake_display_time_sensor).publish_state((float) display_ms);
          id(wake_diag_published) = true;
- id: deep_sleep_idle
  mode: restart
  then:
  - if:
      condition:
        switch.is_on: deep_sleep_switch
      then:
      - delay: ${deep_sleep_idle_timeout}
      # If the user intentionally opened the Energy tab, allow continuous
      # minute refreshes. A button/touch leaving the tab restarts this idle
      # script and restores the normal 90s sleep timer.
      - wait_until:
          condition:
            lambda: |-
              if(id(screensaver_enabled) && (id(screensaver_source).current_option()!="Bild" || id(sd_photos).ready()))
                return id(sd_photos).active() && !id(refresh_busy) && id(sd_photos).display_idle() &&
                       id(e1003_usb_power).has_state() && !id(e1003_usb_power).state;
              return (id(current_page)!=9 || !${energy_keep_awake}) && (id(current_page)!=10 || !${solar_keep_awake}) && (id(current_page)!=2 || !${maxim_keep_awake}) && (id(current_page)!=11 || !${elisa_keep_awake});
      - lambda: |-
          id(deep_sleep_prepare_ok)=false;
          ESP_LOGI("deep_sleep", "${deep_sleep_idle_timeout} ohne Bedienung -> GT911 Gesture Mode vorbereiten");

          // GT911 programming guide: write command 0x08 to 0x8046 and then 0x8040.
          // In Gesture Mode INT becomes HIGH / pulses HIGH on double-tap, swipe or supported gesture.
          const uint8_t gesture_cfg[3] = {0x80, 0x46, 0x08};
          const uint8_t gesture_cmd[3] = {0x80, 0x40, 0x08};
          const auto e1 = id(e1003_i2c).write(0x5D, gesture_cfg, sizeof(gesture_cfg));
          const auto e2 = id(e1003_i2c).write(0x5D, gesture_cmd, sizeof(gesture_cmd));
          ESP_LOGI("deep_sleep", "GT911 Gesture Mode I2C: reg8046=%d reg8040=%d (0=OK)", (int)e1, (int)e2);
          if (e1 != esphome::i2c::ERROR_OK || e2 != esphome::i2c::ERROR_OK) {
            ESP_LOGE("deep_sleep", "GT911 Gesture Mode konnte nicht aktiviert werden; Deep Sleep wird für Sicherheit abgebrochen");
            return;
          }

          // ESP32-S3 cannot use opposite trigger levels in one EXT1 set on this target.
          // Therefore: buttons use EXT1 ANY_LOW, GT911 gesture INT uses EXT0 HIGH.
          esp_sleep_disable_ext1_wakeup_io(0);
          esp_sleep_disable_wakeup_source(ESP_SLEEP_WAKEUP_EXT0);
          const uint64_t button_mask = (1ULL << 3) | (1ULL << 4) | (1ULL << 5);
          const esp_err_t wb = esp_sleep_enable_ext1_wakeup(button_mask, ESP_EXT1_WAKEUP_ANY_LOW);
          const esp_err_t wt = esp_sleep_enable_ext0_wakeup(GPIO_NUM_2, 1);
          ESP_LOGI("deep_sleep", "Wakeup konfiguriert: EXT1 Tasten LOW err=%d, EXT0 GT911 GPIO2 HIGH err=%d", (int)wb, (int)wt);
          if (wb != ESP_OK || wt != ESP_OK) {
            ESP_LOGE("deep_sleep", "EXT0/EXT1-Wakeup konnte nicht konfiguriert werden; Deep Sleep wird abgebrochen");
            return;
          }
          id(deep_sleep_prepare_ok)=true;
          id(sleep_indicator)=!id(sd_photos).active();
          id(status_dirty)=true;
          if(!id(sd_photos).active()) ESP_LOGI("deep_sleep", "Sleep-Symbol wird vor Deep Sleep auf das ePaper geschrieben");
          ESP_LOGI("deep_sleep", "Deep Sleep: Wake via Double-Tap/Swipe, Tasten oder ${deep_sleep_wakeup_interval}-Timer");
      - if:
          condition:
            lambda: return id(deep_sleep_prepare_ok) && id(deep_sleep_switch).state;
          then:
          - if:
              condition:
                lambda: return !id(sd_photos).active();
              then:
                - it8951.update:
                    id: epaper
                    mode: DU
          - wait_until:
              condition:
                lambda: return id(sd_photos).display_idle();
          - lambda: |-
              if(id(sd_photos).active()){
                const bool clock=id(screensaver_source).current_option()!="Bild";
                const uint32_t minutes=clock?1:std::stoul(std::string(id(screensaver_interval).current_option().c_str()));
                id(sd_photos).prepare_sleep();
                auto now=id(ha_time).now();
                id(deep_sleep_control).set_sleep_duration(clock && now.is_valid() ? (60-now.second)*1000UL : id(sd_photos).remaining_ms(minutes));
              }
          - delay: 250ms
          - if:
              condition:
                switch.is_on: deep_sleep_switch
              then:
                - deep_sleep.enter: deep_sleep_control
          else:
          - lambda: |-
              id(sleep_indicator)=false;
              id(status_dirty)=true;
              ESP_LOGW("deep_sleep", "Deep Sleep nicht gestartet; Gerät bleibt für Diagnose wach");
- id: navigate_pages
  mode: single
  parameters:
    direction: int
  then:
  - lambda: |-
      if(id(screensaver_waking)){id(screensaver_waking)=false;return;}
      auto allowed=[&](int p)->bool{
        uint32_t bit=p==11?16U:(p==0?1U:(p==1 || (p>=8 && p<=10)?2U:(p>=2 && p<=6?4U:8U)));
        return (id(nav_visibility_mask)&bit)!=0U;
      };
      const int top_pages[5]={0,1,2,11,7};
      if(direction==0){
        for(int i=0;i<5;i++)if(allowed(top_pages[i])){id(select_page).execute(top_pages[i]);break;}
        return;
      }
      const int page=id(current_page);
      auto adjacent_top=[&](int position)->int{
        for(int i=1;i<=5;i++){
          const int candidate=top_pages[(position+(direction>0?i:5-(i%5)))%5];
          if(allowed(candidate))return candidate;
        }
        return top_pages[position];
      };
      if(allowed(page) && (page==1 || (page>=8 && page<=10))){
        const int p[4]={1,8,9,10};
        int pos=0;for(int i=0;i<4;i++)if(p[i]==page){pos=i;break;}
        if(direction>0 && pos==3)id(select_page).execute(adjacent_top(1));
        else if(direction<0 && pos==0)id(select_page).execute(adjacent_top(1));
        else id(select_page).execute(p[pos+(direction>0?1:-1)]);
      }else if(allowed(page) && page>=2 && page<=6){
        if(direction>0 && page==6)id(select_page).execute(adjacent_top(2));
        else if(direction<0 && page==2)id(select_page).execute(adjacent_top(2));
        else id(select_page).execute(page+(direction>0?1:-1));
      }else{
        int pos=0;for(int i=0;i<5;i++)if(top_pages[i]==page){pos=i;break;}
        id(select_page).execute(adjacent_top(pos));
      }
- id: select_page
  mode: single
  parameters:
    target: int
  then:
  - lambda: |-
      if (target < 0 || target > 11) return;
      uint32_t required=target==11?16U:(target==0?1U:(target==1 || (target>=8 && target<=10)?2U:(target>=2 && target<=6?4U:8U)));
      if(!(id(nav_visibility_mask)&required)){
        ESP_LOGW("nav_gate", "Navigation zu ausgeblendetem Bereich blockiert: Seite %d",target);
        return;
      }
      if (id(refresh_busy) || target == id(current_page)) return;
      id(current_page) = target;
      id(e1003_active_page).publish_state(std::to_string(target));
      ESP_LOGI("data_gate", "Aktive Seite %d: HA-Datenpakete nur fuer geoeffnete Ansichten", target);
      id(list_offset) = 0;
      id(force_content)=true; id(refresh_display).execute();
- id: elisa_refresh
  mode: restart
  then:
  # Coalesce HA payload updates; retry dirty data after a busy display.
  - delay: 500ms
  - if:
      condition:
        lambda: |-
          if(id(sd_photos).active() || id(current_page)!=11 || !id(initial_render_done) || id(refresh_busy))return false;
          const auto t=id(ha_time).now();
          const int64_t minute=t.is_valid()?int64_t(t.timestamp)/60:int64_t(millis()/60000UL);
          return (id(dirty_pages)&(1U<<11)) || minute!=id(elisa_last_minute);
      then:
      - lambda: |-
          const auto t=id(ha_time).now();
          id(elisa_last_minute)=t.is_valid()?int64_t(t.timestamp)/60:int64_t(millis()/60000UL);
          id(dirty_pages)|=(1U<<11);
          id(elisa_partial_refresh)=true;
      - script.execute: refresh_display
- id: refresh_from_ha
  mode: restart
  then:
  - if:
      condition:
        lambda: return !id(sd_photos).active() && !id(refresh_busy) && id(current_page)!=2 && ((id(dirty_pages)&(1U<<id(current_page))) || id(status_dirty));
      then:
      - script.execute: refresh_display
- id: refresh_display
  mode: single
  then:
  - if:
      condition:
        lambda: return !id(sd_photos).active() && !id(sd_photos).resume_requested();
      then:
      - wait_until:
          condition:
            lambda: return id(sd_photos).display_idle();
      - lambda: id(refresh_busy)=true;
      - delay: 10ms
      - lambda: |-
          id(last_refresh_ms)=millis();
          if(id(full_refresh_due)) ESP_LOGI("ui_refresh", "Displayupdate: FULL (Boot/Wakeup oder 60min)");
          else if(id(home_partial_refresh)) ESP_LOGI("ui_refresh", "Displayupdate: PARTIAL Home");
      # DU is limited to monochrome Maxim/Elisa partials. Gray regions use GC16.
      - if:
          condition:
            lambda: |-
              const bool clean_due=id(last_full_refresh_ms)!=0 &&
                (uint32_t)(millis()-id(last_full_refresh_ms))>=3600000UL;
              const bool mono_du_partial=id(maxim_partial_refresh)||id(elisa_partial_refresh);
              return id(initial_render_done) && !id(full_refresh_due) &&
                     !id(force_content) && !clean_due && mono_du_partial;
          then:
          - it8951.update:
              id: epaper
              mode: DU
          else:
          - it8951.update:
              id: epaper
              mode: GC16
      - wait_until:
          condition:
            lambda: return id(sd_photos).display_idle();
      - lambda: |-
          id(status_dirty)=false;
          ESP_LOGD("home_timing", "Seite %d: component.update-Aufruf inklusive Renderer: %u ms", id(current_page), (unsigned)(millis()-id(last_refresh_ms)));
          if (id(wake_display_ms) == 0) {
            id(wake_display_ms) = millis();
            ESP_LOGI("wake_history", "Erster Displayaufbau nach Wake fertig: %u ms", (unsigned) id(wake_display_ms));
          }
          id(refresh_busy)=false;
          id(initial_render_done)=true;
      - if:
          condition:
            lambda: return !id(wake_diag_published) && id(wake_api_ms) > 0 && id(wake_display_ms) > 0;
          then:
          - script.execute: publish_wake_diagnostics
i2c:
  id: e1003_i2c
  sda: GPIO19
  scl: GPIO20
touchscreen:
- platform: gt911
  id: e1003_touch
  i2c_id: e1003_i2c
  display: epaper
  interrupt_pin: GPIO2
  reset_pin: GPIO48
  transform:
    # GT911 X already runs in the display's logical direction on this E1003.
    # The previous mirror_x inverted the navigation a second time.
    mirror_x: false
  on_touch:
  - script.execute: screensaver_activity
  - script.execute: deep_sleep_idle
  - lambda: |-
      id(sd_photos).activity();
      if(id(screensaver_waking)){id(screensaver_waking)=false;return;}
      const int W = id(epaper).get_width();
      const int H = id(epaper).get_height();
      const int NAV_LEFT = 12, NAV_RIGHT = W - 210;
      const int NAV1_TOP = 8, NAV1_BOTTOM = 88;
      const int NAV2_TOP = 96, NAV2_BOTTOM = 168;
      const bool maxim_level = id(current_page) >= 2 && id(current_page) <= 6;
      const bool home_level = id(current_page)==1 || (id(current_page)>=8 && id(current_page)<=10);
      // Align the touch-cell edges EXACTLY with the integer-divided drawn tabs.
      // Multiplication-before-division would misroute boundary pixels.
      auto nav_cell=[&](int x,int count)->int {
        int cell=0;
        for(int i=1;i<count;i++)
          if(x>=NAV_LEFT+i*(NAV_RIGHT-NAV_LEFT)/count)cell=i;
        return cell;
      };

      // Always log the received display coordinates before doing anything else.
      // The mirrored comparison coordinates make rotation/mirroring mistakes obvious.
      ESP_LOGI("touch_nav",
               "TOUCH x=%d y=%d | raw x=%d y=%d | Vergleich gespiegelt x=%d y=%d | Display=%dx%d | Seite=%d refresh_busy=%d",
               touch.x, touch.y, touch.x_raw, touch.y_raw, W - 1 - touch.x, H - 1 - touch.y, W, H,
               id(current_page), id(refresh_busy) ? 1 : 0);
      ESP_LOGI("touch_nav", "Touch-Transform: mirror_x=false, mirror_y=false, swap_xy=false");
      ESP_LOGI("touch_nav",
               "NAV Raster: Ebene1 x=%d..%d y=%d..%d (dynamisch) | Ebene2 x=%d..%d y=%d..%d (Maxim=%d Home=%d)",
               NAV_LEFT, NAV_RIGHT - 1, NAV1_TOP, NAV1_BOTTOM - 1,
               NAV_LEFT, NAV_RIGHT - 1, NAV2_TOP, NAV2_BOTTOM - 1, maxim_level ? 1 : 0, home_level ? 1 : 0);

      // Log dynamically sized first row; hidden areas receive no touch cells.
      const int top_pages[5]={0,1,2,11,7};
      const char *top_names[5]={"Start","Home","Maxim","Elisa","Wetter"};
      const uint32_t top_bits[5]={1U,2U,4U,16U,8U};
      int visible_top[5],visible_count=0;
      for(int i=0;i<5;i++)if(id(nav_visibility_mask)&top_bits[i])visible_top[visible_count++]=i;
      if(visible_count==0){visible_top[0]=0;visible_count=1;}
      ESP_LOGI("touch_nav", "Hauptnavigation %d sichtbare Bereiche (Maske 0x%X)",visible_count,(unsigned)id(nav_visibility_mask));
      if(touch.x>=NAV_LEFT && touch.x<NAV_RIGHT && touch.y>=NAV1_TOP && touch.y<NAV1_BOTTOM){
        const int cell=nav_cell(touch.x,visible_count),idx=visible_top[cell];
        ESP_LOGI("touch_nav","Obere Zelle %d/%d: %s -> Seite %d",cell+1,visible_count,top_names[idx],top_pages[idx]);
      }
      if (id(refresh_busy)) {
        ESP_LOGW("touch_nav", "Touch ignoriert: Display-Refresh läuft gerade");
        return;
      }

      // Home / Übersicht: exact hitboxes captured from the LAST painted grid.
      // Select room FIRST so the Haussteuerung opens on the requested room,
      // rather than choosing the default or preserving an unrelated room.
      if(id(current_page)==0 && touch.y>=152){
        const int right=24+(W-72)/2+24,col=(W-72)/2;
        // Grocery tiles are actions, but only after an exact item hitbox match;
        // use UID to distinguish duplicate item names. No optimistic removal.
        if(touch.x>=right+22 && touch.x<right+col && touch.y>=1155 && touch.y<1362){
          const int tw=col/2-38;
          for(int i=0;i<6;i++){
            const int tx=right+22+(i%2)*(col/2);
            const int ty=1155+(i/2)*72;
            if(touch.x<tx || touch.x>=tx+tw || touch.y<ty || touch.y>=ty+63)continue;
            if(id(shopping_last_touch)!=0 && (uint32_t)(millis()-id(shopping_last_touch))<1200)return;
            auto doc=esphome::json::parse_json(id(start_dashboard_json).state);
            if(doc.isNull()||doc.overflowed())return;
            JsonArray items=doc["shopping"]["items"].as<JsonArray>();
            if(i>=static_cast<int>(items.size()))return;
            JsonObject item=items[i].as<JsonObject>();
            const std::string uid=item["uid"]|"";
            const std::string name=item["summary"]|"";
            if(uid.empty()&&name.empty())return;
            id(shopping_last_touch)=millis();
            ESP_LOGI("shopping","Einkauf geklickt: Eintrag %d: %s",i+1,name.c_str());
            id(shopping_complete).execute(uid,name);
            return;
          }
        }
        // Complete Hausstatus tile opens Haussteuerung without triggering controls.
        if(touch.x>=right && touch.x<right+col && touch.y>=762 && touch.y<1062){
          if(!(id(nav_visibility_mask)&2U))return;
          id(home_selected_room)="";
          id(home_device_offset)=0;
          id(home_message)="";
          ESP_LOGI("home_ui","Start -> Haussteuerung: Hausstatus-Kachel");
          id(select_page).execute(8);return;
        }
      }
      if(id(current_page)==1 && touch.y>=180){
        const auto &ids=id(home_overview_room_ids);
        const auto &rects=id(home_overview_hitboxes);
        if(rects.size()!=ids.size()*4U)return;
        for(size_t i=0;i<ids.size();i++){
          const int x=rects[4*i],y=rects[4*i+1],w=rects[4*i+2],h=rects[4*i+3];
          if(touch.x>=x && touch.x<x+w && touch.y>=y && touch.y<y+h){
            if(millis()-id(home_last_touch)<350)return;
            id(home_last_touch)=millis();
            id(home_selected_room)=ids[i];
            id(home_device_offset)=0;
            id(home_message)="";
            ESP_LOGI("home_ui","Uebersicht -> Haussteuerung: Raum %s, Touch x=%d y=%d, Kachel %d/%d/%d/%d",
                     ids[i].c_str(),touch.x,touch.y,x,y,w,h);
            id(select_page).execute(8);
            return;
          }
        }
        ESP_LOGD("touch_nav","Home Uebersicht: keine Raumkachel an x=%d y=%d",touch.x,touch.y);
        return;
      }

      if (id(current_page)==8 && touch.y>=180) {
        auto l=epaper_home::Layout{W,H};
        l.top=184; // must match Haussteuerung renderer
        const int DEVICE_TOP=250;
        const int DEVICE_ROWS=std::max(1,(H-DEVICE_TOP-95)/l.card_h);
        // The pager extends to the bottom edge: GT911 produced y=1386..1398
        // for taps on the bottom control, outside the old H-20 hitbox.
        const int PAGER_TOP=H-98;
        if(millis()-id(home_last_touch)<350)return;
        id(home_last_touch)=millis();
        auto doc=esphome::json::parse_json(id(home_render_json));
        if(doc.isNull() || doc.overflowed())return;
        JsonArray rooms=doc["rooms"].as<JsonArray>();
        auto repaint=[&](){id(home_partial_refresh)=true;id(refresh_display).execute();};
        if(touch.x>=12 && touch.x<l.sidebar) {
          // Touch uses EXACTLY the ordered room list of the last painted frame.
          // Floor headings are non-clickable; room cells fill the remaining height.
          const auto &order=id(home_room_order);
          const auto &floors=id(home_room_floors);
          if(order.size()!=floors.size())return;
          // One-page compact layout. Geometry below MUST match the Home renderer.
          // All room tiles are touchable, floor headings and inter-tile gaps are not.
          const int shown=(int)order.size();
          const int room_bottom=H-20;
          const int header_h=36;
          int headings=0;
          for(int row=0;row<shown;row++)
            if(row==0 || floors[row]!=floors[row-1])headings++;
          const int room_space=std::max(0,room_bottom-l.top-headings*header_h);
          if(shown>0 && touch.y>=l.top && touch.y<room_bottom){
            int y=l.top;
            for(int row=0;row<shown;row++){
              if(row==0 || floors[row]!=floors[row-1])y+=header_h;
              // Cumulative division spreads the remainder across ALL tiles.
              const int tile_span=(row+1)*room_space/shown-row*room_space/shown;
              const int end_y=y+tile_span;
              const int height=std::max(1,tile_span-4);
              if(touch.y>=y && touch.y<y+height){
                const int i=order[row];
                if(i>=0 && i<(int)rooms.size()){
                  id(home_selected_room)=rooms[i]["id"].as<std::string>();
                  id(home_device_offset)=0;id(home_message)="";
                  ESP_LOGI("home_ui","Etage %s / Raum gewaehlt: %s (y=%d..%d)",
                           floors[row].c_str(),id(home_selected_room).c_str(),y,y+height-1);
                  repaint();
                }
                return;
              }
              y=end_y;
            }
          }
          return;
        }
        JsonObject room;
        for(JsonObject r:rooms)if(r["id"].as<std::string>()==id(home_selected_room)){room=r;break;}
        JsonArray devices=room["entities"].as<JsonArray>();
      // Display rows: pair matching light/cover names containing the standalone
      // words Links and Rechts. No pairing across different device types or
      // different name stems (for example "Licht - Links" / "Licht - Rechts").
      auto build_device_rows=[](JsonArray all)->std::vector<std::pair<int,int>> {
        std::vector<std::pair<int,int>> result;
        std::vector<bool> used(all.size(),false);
        auto pair_name=[](JsonObject e)->std::pair<int,std::string> {
          std::string domain=e["d"] | "";
          if(domain!="light" && domain!="cover")return {0,""};
          std::string name=e["n"] | "";
          std::string token,stem;
          int side=0;
          auto flush=[&](){
            if(token.empty())return;
            if(token=="links" || token=="rechts"){
              const int found=token=="links"?1:2;
              side=(side==0 || side==found)?found:3;
            }else{
              if(!stem.empty())stem+=" ";
              stem+=token;
            }
            token.clear();
          };
          for(unsigned char c:name){
            if((c>='a' && c<='z') || (c>='A' && c<='Z') || (c>='0' && c<='9'))
              token+=(char)std::tolower(c);
            else flush();
          }
          flush();
          return (side==1 || side==2)?std::make_pair(side,domain+"|"+stem):std::make_pair(0,std::string());
        };
        for(int i=0;i<(int)all.size();i++){
          if(used[i])continue;
          used[i]=true;
          JsonObject e=all[i].as<JsonObject>();
          auto current=pair_name(e);
          bool found=false;
          if(current.first>0)for(int j=i+1;j<(int)all.size();j++){
            if(used[j])continue;
            JsonObject other=all[j].as<JsonObject>();
            auto candidate=pair_name(other);
            if(candidate.second==current.second && candidate.first>0 && candidate.first!=current.first){
              used[j]=true;
              result.emplace_back(current.first==1?i:j,current.first==1?j:i);
              found=true;
              break;
            }
          }
          if(!found)result.emplace_back(i,-1);
        }
        return result;
      };
        const auto slots=build_device_rows(devices);
        if(touch.x>=l.right() && touch.x<W-24 && touch.y>=PAGER_TOP && touch.y<H) {
          const int last=slots.empty()?0:(((int)slots.size()-1)/DEVICE_ROWS)*DEVICE_ROWS;
          const int old_offset=id(home_device_offset);
          const int direction=touch.x<l.right()+l.card_width()/2?-1:1;
          id(home_device_offset)=std::max(0,std::min(last,old_offset+direction*DEVICE_ROWS));
          ESP_LOGI("home_ui","Geraete-Navigation %s: touch=(%d,%d), Offset %d -> %d, Zeilen %u, letzte Seite %d",
                   direction<0?"Zurueck":"Weiter",touch.x,touch.y,old_offset,id(home_device_offset),
                   (unsigned)slots.size(),last);
          if(old_offset!=id(home_device_offset))repaint();
          return;
        }
        if(touch.x<l.right() || touch.x>=W-24 || touch.y<DEVICE_TOP || touch.y>=PAGER_TOP)return;
        const int row=(touch.y-DEVICE_TOP)/l.card_h, within=(touch.y-DEVICE_TOP)%l.card_h;
        const int slot_index=id(home_device_offset)+row;
        if(row>=DEVICE_ROWS || slot_index>=(int)slots.size() || within<115 || within>=195)return;
        const auto slot=slots[slot_index];
        const int full_width=l.card_width();
        const int half=(full_width-16)/2;
        const bool paired=slot.second>=0;
        const int second_x=l.right()+half+16;
        const bool right_card=paired && touch.x>=second_x;
        if(paired && touch.x>=l.right()+half && touch.x<second_x)return;
        const int card_index=right_card?slot.second:slot.first;
        JsonObject e=devices[card_index].as<JsonObject>();
        const int card_x=right_card?second_x:l.right();
        const int card_width=paired?(right_card?full_width-half-16:half):full_width;
        if(touch.x>=card_x+card_width)return;
        auto buttons=epaper_home::buttons(e);
        if(buttons.empty())return;
        const int bw=(card_width-40)/(int)buttons.size();
        const int relative=touch.x-card_x-20;
        if(relative<0 || bw<=0)return;
        const int b=relative/bw;
        if(b>=(int)buttons.size() || relative%bw>=bw-10 || !buttons[b].enabled)return;
        if(!id(e1003).is_connected()) {
          id(home_message)="Keine Verbindung zu Home Assistant.";repaint();return;
        }
        const auto &button=buttons[b];
        ESP_LOGI("home_ui","Geraet %s [%s] Button %s, Karte x=%d..%d, Zeile=%d",
                 e["id"] | "?",right_card?"rechts":"links",button.label.c_str(),card_x,card_x+card_width-1,row);
        // Resolve light on/off in HA, never against a possibly stale display snapshot.
        const bool power_button=e["d"].as<std::string>()=="light" &&
            (button.operation=="on" || button.operation=="off");
        id(home_command).execute(e["id"].as<std::string>(),power_button?std::string("toggle"):button.operation,button.value);
        return;
      }

      // Shared footer geometry for Maxim lists (substitutions, homework, exams).
      if(id(current_page)>=4 && id(current_page)<=6 && touch.y>=H-72 && touch.y<H){
        const int direction=touch.x<W/3?-1:(touch.x>=2*W/3?1:0);
        const int next=std::max(0,std::min(id(list_offset)+direction,id(list_pages)-1));
        if(direction && next!=id(list_offset)){
          id(list_offset)=next;
          id(dirty_pages)|=1U<<id(current_page);
          ESP_LOGI("touch_nav","Maxim Blaettern: Seite=%d Abschnitt=%d/%d",id(current_page),next+1,id(list_pages));
          id(refresh_display).execute();
        }
        return;
      }

      // Level 1: only the enabled tabs, resized to use the full row.
      if(touch.y>=NAV1_TOP && touch.y<NAV1_BOTTOM && touch.x>=NAV_LEFT && touch.x<NAV_RIGHT){
        int cell=nav_cell(touch.x,visible_count);
        const int idx=visible_top[cell];
        ESP_LOGI("touch_nav","TREFFER Ebene1 %s -> Seite %d (Maske 0x%X)",top_names[idx],top_pages[idx],(unsigned)id(nav_visibility_mask));
        id(select_page).execute(top_pages[idx]);
        return;
      }

      // Level 2 exists inside Home (4 tabs) and Maxim (5 tabs).
      if ((home_level || maxim_level) && touch.y >= NAV2_TOP && touch.y < NAV2_BOTTOM &&
          touch.x >= NAV_LEFT && touch.x < NAV_RIGHT) {
        const int count=home_level?4:5;
        int cell=nav_cell(touch.x,count);
        const int home_targets[4]={1,8,9,10};
        const char *home_names[4]={"Übersicht","Haussteuerung","Energie","Solar"};
        const int maxim_targets[5]={2,3,4,5,6};
        const char *maxim_names[5]={"Übersicht","Stundenplan","Vertretungsplan","Hausaufgaben","Arbeiten"};
        const int target=home_level?home_targets[cell]:maxim_targets[cell];
        int x0=NAV_LEFT+cell*(NAV_RIGHT-NAV_LEFT)/count;
        int x1=NAV_LEFT+(cell+1)*(NAV_RIGHT-NAV_LEFT)/count-1;
        ESP_LOGI("touch_nav",
                 "TREFFER Ebene2: x=%d y=%d -> '%s' | Zelle=%d Sollbereich x=%d..%d y=%d..%d -> Seite=%d",
                 touch.x,touch.y,home_level?home_names[cell]:maxim_names[cell],cell,x0,x1,NAV2_TOP,NAV2_BOTTOM-1,target);
        id(select_page).execute(target);
        return;
      }

      if (touch.y >= NAV2_TOP && touch.y < NAV2_BOTTOM && !maxim_level && !home_level) {
        ESP_LOGW("touch_nav",
                 "Touch liegt in Ebene2 (y=%d), aber kein Untermenü ist auf Seite %d aktiv",
                 touch.y, id(current_page));
      } else if (touch.y >= NAV1_BOTTOM && touch.y < NAV2_TOP) {
        ESP_LOGW("touch_nav", "Touch im Zwischenraum der Navigationszeilen: y=%d", touch.y);
      } else if (touch.y >= NAV2_BOTTOM) {
        ESP_LOGW("touch_nav", "Touch unterhalb der Navigation/Inhaltsbereich: x=%d y=%d", touch.x, touch.y);
      } else if (touch.y < NAV1_TOP) {
        ESP_LOGW("touch_nav", "Touch oberhalb der Navigation: y=%d", touch.y);
      } else {
        ESP_LOGW("touch_nav", "Touch innerhalb Navigation nicht zugeordnet: x=%d y=%d", touch.x, touch.y);
      }
spi:
  id: epaper_spi_bus
  interface: spi2  # shared with SDSPI; keep this explicit
  clk_pin: GPIO7
  mosi_pin: GPIO9
  miso_pin: GPIO8
display:
- platform: it8951
  id: epaper
  auto_clear_enabled: false
  spi_id: epaper_spi_bus
  model: seeed-reterminal-e1003
  vcom: 1400
  vcom_register: 2
  force_temperature: 25
  update_interval: never
  # Keep automatic count-triggered cleans rare. Explicit full redraws happen
  # at every boot/wake and after 60min awake; normal rendering remains grayscale GC16.
  full_update_every: 255
  grayscale: true
  dithering: false
  update_mode: GC16
  transform:
    mirror_x: true
    mirror_y: false
    swap_xy: false
  rotation: 0
  lambda: |
    if(id(sd_photos).active()){
      if(id(screensaver_source).current_option()=="Bild"){
        id(sd_photos).render();
        return;
      }
      const int W=it.get_width(), H=it.get_height();
      const Color ink=Color::BLACK;
      it.fill(Color::WHITE);
      auto now=id(ha_time).now();
      if(!now.is_valid()){
        it.print(W/2,H/2,id(font_weather_condition),ink,TextAlign::CENTER,"Uhrzeit wird synchronisiert");
        return;
      }
      static const char *days[]={"", "Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
      if(id(screensaver_source).current_option()=="Analoge Uhr"){
        const int cx=W/2, cy=(H-190)/2, r=std::min(W/2-30,cy-20);
        it.circle(cx,cy,r,ink);
        for(int m=0;m<60;m++){
          const double a=m*3.141592653589793/30.0-3.141592653589793/2;
          const int inner=r-(m%5==0?42:17);
          for(int offset=-1;offset<=1;offset++)
            it.line(cx+int(inner*cos(a))+offset,cy+int(inner*sin(a)),cx+int((r-8)*cos(a))+offset,cy+int((r-8)*sin(a)),ink);
          if(m%5==0)it.printf(cx+int((r-85)*cos(a)),cy+int((r-85)*sin(a)),id(font_start_weather),ink,TextAlign::CENTER,"%d",m==0?12:m/5);
        }
        auto hand=[&](double a,int length,int width){
          a=a*3.141592653589793/30.0-3.141592653589793/2;
          const int ex=cx+int(length*cos(a)),ey=cy+int(length*sin(a));
          const int dx=int(width*sin(a)),dy=-int(width*cos(a));
          it.filled_triangle(cx+dx,cy+dy,cx-dx,cy-dy,ex,ey,ink);
        };
        hand((now.hour%12)*5+now.minute/12.0,int(r*0.55),18);
        hand(now.minute,int(r*0.79),11);
        it.filled_circle(cx,cy,24,ink);
      }else{
        it.printf(W/2,(H-190)/2,id(font_screensaver_clock),ink,TextAlign::CENTER,"%02d:%02d",now.hour,now.minute);
      }
      it.printf(W/2,H-155,id(font_weather_condition),ink,TextAlign::CENTER,"%s, %02d.%02d.%04d",days[now.day_of_week],now.day_of_month,now.month,now.year);
      const std::string condition=id(epaper_weather_condition).state;
      const char *weather="Wetter nicht verfügbar";
      if(condition=="sunny")weather="Sonnig";
      else if(condition=="clear-night")weather="Klare Nacht";
      else if(condition=="partlycloudy")weather="Teilweise bewölkt";
      else if(condition=="cloudy")weather="Bewölkt";
      else if(condition=="fog")weather="Nebel";
      else if(condition=="rainy")weather="Regen";
      else if(condition=="pouring")weather="Starker Regen";
      else if(condition=="snowy")weather="Schnee";
      else if(condition=="snowy-rainy")weather="Schneeregen";
      else if(condition=="hail")weather="Hagel";
      else if(condition=="lightning" || condition=="lightning-rainy")weather="Gewitter";
      else if(condition=="windy" || condition=="windy-variant")weather="Windig";
      else if(condition=="exceptional")weather="Außergewöhnlich";
      const std::string raw=id(weather_outdoor_temperature).state;
      char *end=nullptr;float temperature=strtof(raw.c_str(),&end);
      if(end!=raw.c_str() && std::isfinite(temperature))
        it.printf(W/2,H-65,id(font_weather_condition),ink,TextAlign::CENTER,"%s · %.1f °C",weather,temperature);
      else it.printf(W/2,H-65,id(font_weather_condition),ink,TextAlign::CENTER,"%s · -- °C",weather);
      return;
    }
    // Native 1872 x 1404 renderer. No old page or centered 800 x 480 canvas.
    const int W=it.get_width(), H=it.get_height();
    const bool maxim_level=id(current_page)>=2 && id(current_page)<=6;
    const bool home_level=id(current_page)==1 || (id(current_page)>=8 && id(current_page)<=10);
    const int NAV_LEFT=12, NAV_RIGHT=W-210, NAV1_TOP=8, NAV1_BOTTOM=88, NAV2_TOP=96, NAV2_BOTTOM=168;
    // Home and Maxim have second-row navigation; Start and Wetter do not.
    const int CONTENT_TOP=(home_level || maxim_level) ? 180 : 100;
    const Color INK=Color::BLACK, PAPER=Color::WHITE;
    const Color LIGHT(238,238,238), MID(204,204,204), DARK(153,153,153);
    const uint32_t render_start = millis();
    static int painted_page=-1, painted_wifi=-1, painted_battery=-999, painted_sleep=-1, painted_usb=-1;
    static std::string painted_home_room, painted_home_message, painted_home_sidebar_signature;
    static std::string painted_energy_values;
    static int painted_home_room_offset=-1, painted_home_device_offset=-1;
    const bool first=painted_page<0;
    // A logical Home change is distinct from a full-panel refresh. Its old
    // framebuffer remains intact, so the area bounding only modified widgets
    // can be sent to the panel by the IT8951 dirty-region implementation.
    const bool interval_elapsed=id(last_full_refresh_ms)!=0 &&
        (uint32_t)(millis()-id(last_full_refresh_ms))>=3600000UL;
    if(interval_elapsed)id(full_refresh_due)=true;
    const bool home_partial=id(current_page)==8 && painted_page==8 &&
        id(home_partial_refresh) && !id(full_refresh_due) && !first && !id(force_content);
    const bool solar_partial=id(current_page)==10 && painted_page==10 &&
        id(solar_partial_refresh) && !id(full_refresh_due) && !first && !id(force_content);
    id(solar_partial_refresh)=false;
    const bool start_partial=id(current_page)==0 && painted_page==0 &&
        id(start_partial_refresh) && !id(full_refresh_due) && !first && !id(force_content);
    id(start_partial_refresh)=false;
    const bool maxim_partial=id(current_page)==2 && painted_page==2 &&
        id(maxim_partial_refresh) && !id(full_refresh_due) && !first && !id(force_content);
    id(maxim_partial_refresh)=false;
    const bool elisa_partial=id(current_page)==11 && painted_page==11 &&
        id(elisa_partial_refresh) && !id(full_refresh_due) && !first && !id(force_content);
    id(elisa_partial_refresh)=false;
    const bool energy_partial=false;  // Energie: nur bei Navigation oder 60min-FULL zeichnen.
    const bool content_changed=first || painted_page!=id(current_page) || id(force_content) ||
        id(full_refresh_due) || home_partial || energy_partial || solar_partial || start_partial || maxim_partial || elisa_partial || (id(dirty_pages)&(1U<<id(current_page)));
    id(home_partial_refresh)=false;
    id(force_content)=false;
    id(dirty_pages)&=~(1U<<id(current_page));
    // Native IT8951 Gray4 fill: write packed 4-bpp nibbles directly into the
    // existing framebuffer. No temporary RGB888 tile and no per-pixel RGB ->
    // grayscale conversion. Two pixels share one byte; byte-aligned interiors
    // are filled with memset() while odd edge pixels are nibble-preserved.
    uint32_t solid_rect_calls=0, solid_rect_rows=0, solid_blit_calls=0;
    auto fast_rect=[&](int x,int y,int w,int h,Color color){
      int x2=std::min(W,x+w), y2=std::min(H,y+h);
      x=std::max(0,x); y=std::max(0,y); w=x2-x; h=y2-y;
      if(w<=0||h<=0)return;
      solid_rect_calls++;
      solid_rect_rows+=(uint32_t)h;
      solid_blit_calls++;  // one native Gray4 rectangle operation
      esphome::it8951_native::fill_gray4_rect(id(epaper),x,y,w,h,color);
    };
    // Whole-buffer memset is dramatically faster than a 2.43M-pixel partial erase.
    // Repaint the small navigation only when content actually changes.
    static std::string painted_weather_navigation;
    const std::string current_weather_navigation=id(epaper_weather_condition).state;
    const bool weather_navigation_changed=current_weather_navigation!=painted_weather_navigation;
    const bool repaint_nav=(content_changed && !home_partial && !energy_partial && !solar_partial && !start_partial && !maxim_partial && !elisa_partial) ||
        weather_navigation_changed;
    if(content_changed && !home_partial && !energy_partial && !solar_partial && !start_partial && !maxim_partial && !elisa_partial){
      const uint32_t clear_start=millis();
      it.fill(PAPER);
      id(last_full_refresh_ms)=millis();
      id(full_refresh_due)=false;
      ESP_LOGI("ui_refresh", "FULL: gesamte Bildflaeche, 60min-Zaehler neu gestartet");
      ESP_LOGI("ui_timing","Puffer löschen: %u ms",(unsigned)(millis()-clear_start));
    } else if(maxim_partial) {
      ESP_LOGI("ui_refresh", "PARTIAL Maxim: nur geaenderte Werte oder Karten");
    } else if(start_partial) {
      ESP_LOGI("ui_refresh", "PARTIAL Start: nur geaenderte Karten");
    } else if(solar_partial) {
      ESP_LOGI("ui_refresh", "PARTIAL Solar: nur geaenderte Werte/Balken; FULL-Zaehler unveraendert");
    } else if(home_partial) {
      ESP_LOGI("ui_refresh", "PARTIAL: kein it.fill(), Home-Kacheln werden einzeln verglichen");
    } else if(energy_partial) {
      ESP_LOGI("ui_refresh", "PARTIAL: kein it.fill(), Energy-Werte werden gezielt aktualisiert");
    }
    struct RenderTiming {uint32_t start;int page;~RenderTiming(){ESP_LOGI("ui_timing","Seite %d: Aufbau %u ms",page,(unsigned)(millis()-start));}} timing{render_start,id(current_page)};
    auto now=id(ha_time).now();
    auto clean=[](std::string s) {
      std::string out; bool space=false;
      for(size_t i=0;i<s.size();i++) { char ch=s[i];
        if(ch=='<' && i+1<s.size() && (std::isalpha(static_cast<unsigned char>(s[i+1]))||s[i+1]=='/')) {
          auto end=s.find('>',i+1);if(end!=std::string::npos){i=end;ch=' ';}
        }
        if(ch=='\n'||ch=='\r'||ch=='\t')ch=' ';
        if(ch==' ' && space)continue; space=ch==' '; out+=ch;
      }
      const std::pair<const char*,const char*> entities[]={{"&amp;","&"},{"&nbsp;"," "},{"&lt;","<"},{"&gt;",">"},{"&quot;","\""},{"&#39;","'"}};
      for(auto e:entities){size_t p=0;while((p=out.find(e.first,p))!=std::string::npos){out.replace(p,strlen(e.first),e.second);p+=strlen(e.second);}}
      return out;
    };
    auto value=[&](JsonVariant v)->std::string {
      if(v.isNull())return "";
      if(v.is<const char*>())return clean(v.as<std::string>());
      if(v.is<int>())return std::to_string(v.as<int>());
      return "";
    };
    auto pop_utf=[](std::string &s){if(s.empty())return;size_t p=s.size()-1;while(p>0 && (static_cast<unsigned char>(s[p])&0xC0)==0x80)--p;s.resize(p);};
    auto width=[&](const std::string&s,auto f){int x,y,w,h;it.get_text_bounds(0,0,s.c_str(),f,TextAlign::TOP_LEFT,&x,&y,&w,&h);return w;};
    // Measure UTF-8 prefixes by binary search instead of removing one byte at a time.
    auto prefix=[&](const std::string&s,auto f,int maxw,const std::string&suffix){
      std::vector<size_t> ends{0};for(size_t p=0;p<s.size();){p++;while(p<s.size()&&(static_cast<unsigned char>(s[p])&0xC0)==0x80)p++;ends.push_back(p);}
      size_t lo=0,hi=ends.size()-1;while(lo<hi){size_t mid=(lo+hi+1)/2;if(width(s.substr(0,ends[mid])+suffix,f)<=maxw)lo=mid;else hi=mid-1;}return ends[lo];
    };
    auto fit=[&](std::string s,auto f,int maxw){if(width(s,f)<=maxw)return s;return s.substr(0,prefix(s,f,maxw,"..."))+"...";};
    auto lines=[&](std::string s,auto f,int maxw){
      std::vector<std::string> out;s=clean(s);size_t offset=0;
      while(offset<s.size()){
        std::string rest=s.substr(offset);size_t cut=prefix(rest,f,maxw,"");
        if(cut==0){cut=1;while(cut<rest.size()&&(static_cast<unsigned char>(rest[cut])&0xC0)==0x80)cut++;}
        if(cut<rest.size()){size_t blank=rest.rfind(' ',cut);if(blank!=std::string::npos&&blank>cut/3)cut=blank;}
        out.push_back(rest.substr(0,cut));offset+=cut;while(offset<s.size()&&s[offset]==' ')offset++;
      }
      return out;
    };
    uint32_t text_draw_calls=0;
    auto text=[&](int x,int y,const std::string&s,auto f,Color color,int maxw){text_draw_calls++;it.printf(x,y,f,color,"%s",fit(s,f,maxw).c_str());};
    auto center=[&](int x,int y,const std::string&s,auto f,Color color){text_draw_calls++;it.printf(x,y,f,color,TextAlign::CENTER,"%s",s.c_str());};
    // A single render lambda survives display.update(): retain precise number-only
    // cells generated by the LAST full render, not guessed from fixed text offsets.
    static int maxim_clock_hour_x=-1, maxim_clock_minute_x=-1, maxim_clock_digit_y=-1;
    static int maxim_clock_digit_w=0, maxim_clock_digit_h=0, maxim_clock_text_y=0;
    static int maxim_count_hour_x=-1, maxim_count_minute_x=-1, maxim_count_digit_y=-1;
    static int maxim_count_hour_w=0, maxim_count_minute_w=0, maxim_count_digit_h=0;
    if(maxim_partial){
      // A single immutable minute snapshot eliminates the visible offset between
      // clock and countdown. Clear to PAPER and draw the final values before
      // the ONE IT8951 update; never send a separate "blank" frame.
      if(id(maxim_time_part)!=5 || id(maxim_tick_epoch)<=0)return;
      const auto t=esphome::ESPTime::from_epoch_local((time_t)id(maxim_tick_epoch));
      const int64_t seconds=std::max(int64_t(0),id(maxim_target_epoch)-id(maxim_tick_epoch));
      const int64_t total_minutes=(seconds+59)/60;
      const int64_t h=total_minutes/60,m=total_minutes%60;
      unsigned changed=0;
      if(maxim_clock_hour_x>=0 && t.hour!=id(maxim_clock_hours_value)){
        char digits[8];snprintf(digits,sizeof(digits),"%02d",t.hour);
        fast_rect(maxim_clock_hour_x,maxim_clock_digit_y,maxim_clock_digit_w,maxim_clock_digit_h,PAPER);
        text(maxim_clock_hour_x+3,maxim_clock_text_y,digits,id(font_maxim_clock),INK,maxim_clock_digit_w-6);
        id(maxim_clock_hours_value)=t.hour;changed++;
      }
      if(maxim_clock_minute_x>=0 && t.minute!=id(maxim_clock_minutes_value)){
        char digits[8];snprintf(digits,sizeof(digits),"%02d",t.minute);
        fast_rect(maxim_clock_minute_x,maxim_clock_digit_y,maxim_clock_digit_w,maxim_clock_digit_h,PAPER);
        text(maxim_clock_minute_x+3,maxim_clock_text_y,digits,id(font_maxim_clock),INK,maxim_clock_digit_w-6);
        id(maxim_clock_minutes_value)=t.minute;changed++;
      }
      if(id(maxim_target_epoch)>0 && h>0 && maxim_count_hour_x>=0 && h!=id(maxim_school_hours_value)){
        const std::string digits=std::to_string(h);
        fast_rect(maxim_count_hour_x,maxim_count_digit_y,maxim_count_hour_w,maxim_count_digit_h,PAPER);
        text(maxim_count_hour_x+maxim_count_hour_w-width(digits,id(font_lesson))-2,
             maxim_count_digit_y+2,digits,id(font_lesson),INK,maxim_count_hour_w);
        id(maxim_school_hours_value)=h;changed++;
      }
      if(id(maxim_target_epoch)>0 && maxim_count_minute_x>=0 && m!=id(maxim_school_minutes_value)){
        const std::string digits=std::to_string(m);
        fast_rect(maxim_count_minute_x,maxim_count_digit_y,maxim_count_minute_w,maxim_count_digit_h,PAPER);
        text(maxim_count_minute_x+maxim_count_minute_w-width(digits,id(font_lesson))-2,
             maxim_count_digit_y+2,digits,id(font_lesson),INK,maxim_count_minute_w);
        id(maxim_school_minutes_value)=int(m);changed++;
      }
      ESP_LOGI("maxim_time","Uhr + Countdown: %u Zahlenfelder im selben Frame (%02d:%02d / %lld Std %lld Min)",
               changed,t.hour,t.minute,(long long)h,(long long)m);
      id(maxim_time_part)=0;
      return;
    }
    // Main navigation shares all available width between enabled tabs.
    const char* top_tabs[]={"Start","Home","Maxim","Elisa","Wetter"};
    auto navigation_weather_glyph=[&]()->const char*{
