      int h=0,m=0,sec=0;if(sscanf(s.c_str()+11,"%d:%d:%d",&h,&m,&sec)<2)return -1;
      if(h>23||m>59||sec>59)return -1;
      size_t tz=s.find_first_of("Zz+-",16);
      if(tz!=std::string::npos){int offset=0;if(s[tz]!='Z'&&s[tz]!='z'){int oh=0,om=0;sscanf(s.c_str()+tz+1,"%d:%d",&oh,&om);offset=(oh*60+om)*60*(s[tz]=='-'?-1:1);}
        auto t=esphome::ESPTime::from_epoch_local(d*86400+h*3600+m*60+sec-offset);
        return civil(t.year,t.month,t.day_of_month)*86400+t.hour*3600+t.minute*60+t.second;
