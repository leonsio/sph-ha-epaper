        if(c=="cloudy")return "Bewölkt";
        if(c=="rainy"||c=="pouring")return "Regnerisch";
        if(c=="lightning"||c=="lightning-rainy")return "Gewitter";
        if(c=="snowy"||c=="snowy-rainy")return "Schneefall";
