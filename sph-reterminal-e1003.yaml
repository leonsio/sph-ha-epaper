      else if(std::isfinite(forecast_high))snprintf(temp_range,sizeof(temp_range),"Max %.0f °C",forecast_high);
      else if(std::isfinite(forecast_low))snprintf(temp_range,sizeof(temp_range),"Min %.0f °C",forecast_low);
      else snprintf(temp_range,sizeof(temp_range),"Min / Max: keine Daten");
      const std::string top_key=title+day_label+std::to_string(first_start)+forecast_condition+std::string(temp_range);
      const bool top_card=card(0,lx,y,lw,top_h,top_key);
      // Same large font for static words and the dynamically updated digit cells.
      // Fixed-width NUMBER CELLS keep "Std." and "Min." untouched on every tick.
      const int digit_y=y+132,digit_h=52;
      const int safe_start=std::max(0,std::min(1439,first_start));
      char lesson_clock[16];
      snprintf(lesson_clock,sizeof(lesson_clock),"%02d:%02d",safe_start/60,safe_start%60);
      const std::string lead=std::string("Schulbeginn ")+lesson_clock+" noch ";
      const int count_start=lx+22+width(lead,id(font_lesson))+4;
