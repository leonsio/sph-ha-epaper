        text(slot.x+20,slot.y+14,card.date,id(ui_small),INK,inner_w);
        int yy=slot.y+54;
        for(auto &line:card.title){text(slot.x+20,yy,line,id(ui_tab),INK,inner_w);yy+=42;}
        yy+=12;
        for(auto &line:card.details){text(slot.x+20,yy,line,id(ui_small),INK,inner_w);yy+=32;}
      }
      if(cards.empty())empty("Keine kommenden Arbeiten vorhanden.");
