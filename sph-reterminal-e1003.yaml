    auto heading=[&](std::string title,std::string sub){text(20,CONTENT_TOP+8,title,id(ui_title),INK,W-40);text(20,CONTENT_TOP+58,sub,id(ui_small),INK,W-40);};
    auto empty=[&](std::string message){text(28,CONTENT_TOP+140,message,id(ui_body),INK,W-56);};
    struct Row{std::string title,meta,body;Color shade;bool strike=false;};
    std::vector<Row> rows;
    auto pager=[&](int pages,bool calendar){
      id(list_pages)=std::max(1,pages);id(list_offset)=std::max(0,std::min(id(list_offset),id(list_pages)-1));
      it.line(12,H-72,W-12,H-72,MID);
      text(30,H-57,id(list_offset)>0?"Zurück":"",id(ui_body),INK,W/3-40);
      center(W/2,H-42,calendar?"Zur Wochenansicht":("Abschnitt "+std::to_string(id(list_offset)+1)+" / "+std::to_string(id(list_pages))),id(ui_small),INK);
      text(W-260,H-57,id(list_offset)+1<id(list_pages)?"Weiter":"",id(ui_body),INK,240);
    };
    auto render_rows=[&](bool calendar){
      struct Block{Row r;std::vector<std::string> body;int height;};static std::vector<Block> blocks;static std::string cached_key;
      std::string key=std::to_string(id(current_page))+":"+std::to_string(W);
      for(auto&r:rows){key+="\n"+r.title+"\x1f"+r.meta+"\x1f"+r.body+"\x1f"+std::to_string(r.shade.r);}
      if(key!=cached_key){cached_key=key;blocks.clear();
      for(auto&r:rows){std::string full=r.body;if(width(r.meta,id(ui_small))>W-72)full=r.meta+" · "+full;if(width(r.title,id(ui_tab))>W-72)full=r.title+" · "+full;auto body=lines(full,id(ui_body),W-88);if(body.empty())body.push_back("");
        for(size_t i=0;i<body.size();i+=6){size_t n=std::min(size_t(6),body.size()-i);Row rr=r;if(i)rr.title+=" (Fortsetzung)";
          blocks.push_back({rr,std::vector<std::string>(body.begin()+i,body.begin()+i+n),int(96+n*39)});
        }
      }
      }
      std::vector<std::vector<int>> pages(1);int used=0;const int list_y=CONTENT_TOP+106;int available=H-list_y-92;
      for(size_t i=0;i<blocks.size();i++){if(used+blocks[i].height>available && used>0){pages.push_back({});used=0;}pages.back().push_back(i);used+=blocks[i].height+12;}
      pager(pages.size(),calendar);int y=list_y;
      for(int index:pages[id(list_offset)]){auto&b=blocks[index];it.rectangle(16,y,W-32,b.height,MID);fast_rect(16,y,12,b.height,b.r.shade);fast_rect(32,y+3,W-64,4,b.r.shade);
        text(36,y+10,b.r.title,id(ui_tab),INK,W-72);if(b.r.strike)it.line(36,y+28,W-36,y+28,INK);
        text(36,y+49,b.r.meta,id(ui_small),INK,W-72);int yy=y+88;
        for(auto&line:b.body){text(36,yy,line,id(ui_body),INK,W-72);yy+=39;}y+=b.height+12;
      }
    };
    auto render_days=[&](){
      struct DayBlock {std::string day, title;std::vector<std::string> body;Color shade;int height;};
      std::vector<DayBlock> blocks;
      for(auto &r:rows){
        auto body=lines(r.body,id(ui_small),W-100);
        auto title=lines(r.meta,id(ui_tab),W-100);
        // Include all text, breaking very long daily notices across pages.
        for(size_t i=0;i<std::max(size_t(1),body.size());i+=12){
          std::vector<std::string> chunk(body.begin()+std::min(i,body.size()),body.begin()+std::min(i+12,body.size()));
          std::string heading=r.meta+(i?" · Fortsetzung":"");
          blocks.push_back({r.title,heading,chunk,r.shade,32+int(lines(heading,id(ui_tab),W-100).size())*42+int(chunk.size())*32});
        }
      }
      struct DaySlot {int index,y;bool header,continued;};
      std::vector<std::vector<DaySlot>> pages(1);
      const int top=CONTENT_TOP+106,bottom=H-92,header_h=62;
      int y=top;std::string last;
      for(int i=0;i<(int)blocks.size();i++){
        bool header=last!=blocks[i].day,continued=false;
        if(y+blocks[i].height+(header?header_h:0)>bottom && y>top){
          pages.push_back({});y=top;continued=last==blocks[i].day;header=true;
        }
        pages.back().push_back({i,y,header,continued});
        y+=blocks[i].height+12+(header?header_h:0);last=blocks[i].day;
      }
      pager(pages.size(),false);
      for(auto slot:pages[id(list_offset)]){
        const auto &b=blocks[slot.index];int yy=slot.y;
        if(slot.header){
          fast_rect(20,yy,W-40,50,LIGHT);
          text(36,yy+6,b.day+(slot.continued?" · Fortsetzung":""),id(ui_tab),INK,W-72);
          yy+=header_h;
        }
        fast_rect(28,yy,6,b.height,b.shade);
        for(auto &line:lines(b.title,id(ui_tab),W-100)){text(48,yy+8,line,id(ui_tab),INK,W-100);yy+=42;}
        yy+=8;
        for(auto &line:b.body){text(48,yy+8,line,id(ui_small),INK,W-100);yy+=32;}
      }
    };
    if(id(current_page)==3){
      const uint32_t grid_t0=millis();
      uint32_t grid_step=grid_t0;
      auto grid_mark=[&](const char* label){
        const uint32_t t=millis();
        ESP_LOGI("timetable_timing","%s: +%u ms, gesamt %u ms | fill=%u | text=%u",
          label,(unsigned)(t-grid_step),(unsigned)(t-grid_t0),(unsigned)solid_rect_calls,(unsigned)text_draw_calls);
        grid_step=t;
      };
      ESP_LOGI("timetable_timing","START KFG-Stundenplan");
      if(!now.is_valid()){empty("Uhrzeit wird synchronisiert ...");grid_mark("Abbruch: Uhrzeit ungültig");return;}

      auto timetable=parse_payload(id(epaper_timetable_json).state);
      JsonObject attrs=timetable.as<JsonObject>();
      if(!attrs["eigener_plan"].is<JsonArray>()){
        empty("Stundenplandaten fehlen oder sind ungültig.");
        grid_mark("Abbruch: eigener_plan fehlt");
        return;
      }

      auto upper=[](std::string s){
        for(char&c:s)c=std::toupper(static_cast<unsigned char>(c));
        for(auto p:{std::pair<const char*,const char*>("ä","Ä"),{"ö","Ö"},{"ü","Ü"},{"ß","SS"}}){
          size_t at=0;while((at=s.find(p.first,at))!=std::string::npos){s.replace(at,strlen(p.first),p.second);at+=strlen(p.second);}
        }
        return s;
      };
      auto lesson_badges=[&](JsonObject l){
        std::string b;
        if(l["badge"].is<JsonArray>()){JsonArray badges=l["badge"].as<JsonArray>();for(JsonVariant v:badges)b+=" "+upper(value(v));}
        else b=" "+upper(value(l["badge"]));
        for(char&c:b)if(c=='('||c==')'||c==','||c==';'||c=='/'||c=='|')c=' ';
        return b+" ";
      };
      auto same_slot=[&](JsonObject a,JsonObject b){
        std::string as=value(a["start"]),ae=value(a["end"]),bs=value(b["start"]),be=value(b["end"]);
        if(!as.empty()||!ae.empty()||!bs.empty()||!be.empty())return as==bs&&ae==be;
        return value(a["index"])==value(b["index"])&&value(a["duration"])==value(b["duration"]);
      };
      auto visible_lesson=[&](JsonObject l,JsonArray day,const std::string&w){
        std::string b=lesson_badges(l);
        const bool hasA=b.find(" A ")!=std::string::npos,hasB=b.find(" B ")!=std::string::npos;
        if(hasA||hasB)return (w=="A"&&hasA)||(w=="B"&&hasB)||(w!="A"&&w!="B");
        if(w=="A"||w=="B")for(JsonObject other:day){
          if(!same_slot(l,other))continue;
          std::string ob=lesson_badges(other);
          if(ob.find(" "+w+" ")!=std::string::npos)return false;
        }
        return true;
      };
      auto free_day=[&](int64_t day){
        if(!attrs["freie_tage"].is<JsonArray>())return false;
        JsonArray free_days=attrs["freie_tage"].as<JsonArray>();
        for(JsonVariant v:free_days)if(value(v)==date_string(day))return true;
        return false;
      };

      // KFG profile: current school week, automatically advance once Friday's
      // final lesson has ended. A/B alternates relative to wochenbeginn.
      const int wd=(now.day_of_week+5)%7; // Monday=0 ... Sunday=6
      int64_t monday=today-wd;
      int64_t anchor=parse_day(value(attrs["wochenbeginn"]));
      if(anchor<0)anchor=monday;else anchor-=(anchor+3)%7;
      std::string anchor_week=upper(value(attrs["wochenkennung"]));
      auto week_for=[&](int64_t day){
        if(anchor_week!="A"&&anchor_week!="B")return anchor_week;
        int64_t mon=day-(day+3)%7;
        int64_t distance=(mon-anchor)/7;
        return (std::abs((int)distance)%2)?(anchor_week=="A"?std::string("B"):std::string("A")):anchor_week;
      };
      if(wd>4)monday+=7;
      else if(wd==4){
        JsonArray friday=attrs["eigener_plan"][4].as<JsonArray>();
        std::string current_week=week_for(today);
        int last_end=0,visible_count=0;bool all_valid=true;
        if(!free_day(today))for(JsonObject lesson:friday){
          if(!visible_lesson(lesson,friday,current_week))continue;
          visible_count++;
          int e=minute(value(lesson["end"]));
          if(e<0)all_valid=false;else last_end=std::max(last_end,e);
        }
        if(visible_count==0||(all_valid&&now.hour*60+now.minute>=last_end))monday+=7;
      }
      const std::string school_week=week_for(monday);
      grid_mark("Schulwoche ausgewählt");

      // KFG substitution profile and teacher mapping used by the Lovelace card.
      auto subdoc=parse_payload(id(kfg_substitution_json).state);
      auto teachers=parse_payload(id(kfg_teachers).state);
      auto learning_doc=parse_payload(id(epaper_learning_groups_json).state);
      auto teacher_name=[&](std::string raw){
        if(raw.empty())return raw;
        std::string mapped=value(teachers[raw]);
        if(mapped.empty()&&teachers.is<JsonObject>())for(JsonPair pair:teachers.as<JsonObject>()){
          if(upper(pair.key().c_str())==upper(raw)){mapped=value(pair.value());break;}
        }
        return mapped.empty()?raw:mapped;
      };
      auto subject_name=[&](std::string code){
        if(code.empty())return code;
        for(const char* key:{"eigener_plan","eigener_grundplan"})if(attrs[key].is<JsonArray>()){
          JsonArray plans=attrs[key].as<JsonArray>();
          for(JsonArray day:plans)for(JsonObject lesson:day){
            if(upper(value(lesson["subject"]))==upper(code)||upper(value(lesson["fach"]))==upper(code)){
              std::string full=value(lesson["fach"]);if(!full.empty())return full;
            }
          }
        }
        const std::pair<const char*,const char*> subjects[]={{"E","Englisch"},{"E1","Englisch 1"},{"E2","Englisch 2"},{"D","Deutsch"},{"M","Mathematik"},{"SP","Sport"},{"BIO","Biologie"},{"CH","Chemie"},{"F","Französisch"},{"F2","Französisch 2"},{"L","Latein"},{"L1","Latein 1"},{"L2","Latein 2"},{"GE","Geschichte"},{"PW","Politik und Wirtschaft"},{"GR","Griechisch"},{"ETH","Ethik"},{"REV","Evangelische Religion"},{"RKA","Katholische Religion"},{"KU","Kunst"},{"PH","Physik"},{"MUS","Musik"},{"MU","Musik"},{"DSP","Darstellendes Spiel"}};
        for(auto item:subjects)if(upper(code)==item.first)return std::string(item.second);
        return code;
      };
      auto change_label=[&](std::string art){
        const std::pair<const char*,const char*> labels[]={{"Betr","Betreuung"},{"Vertr","Vertretung"},{"Entf","Entfall"},{"Taus","Tausch"},{"Freis","Freistunde"},{"Raum","Raumänderung"},{"Statt-Vertretung","Statt-Vertretung"},{"Paus","Pausenaufsicht"},{"SES","Sonderunterricht"},{"Vtr. ohne Lehrer","Vertretung ohne Lehrer"}};
        for(auto item:labels)if(art==item.first)return std::string(item.second);
        return art;
      };
      int64_t reference=parse_day(value(subdoc["today"]));if(reference<0)reference=today;
      int refyear=esphome::ESPTime::from_epoch_utc(reference*86400).year;
      auto kfg_day=[&](std::string s){
        int64_t direct=parse_day(s);if(direct>=0)return direct;
        int d=0,m=0,y=0;int count=sscanf(s.c_str(),"%d.%d.%d",&d,&m,&y);
        if(count<2||m<1||m>12||d<1||d>31)return int64_t(-1);
        if(count==3&&y>0)return civil(y<100?2000+y:y,m,d);
        int64_t best=civil(refyear,m,d);
        for(int yr:{refyear-1,refyear+1}){int64_t candidate=civil(yr,m,d);if(std::abs(candidate-reference)<std::abs(best-reference))best=candidate;}
        return best;
      };
      auto substitution_day=[&](int64_t target)->JsonObject{
        if(!subdoc["weeks"].is<JsonArray>())return JsonObject();
        JsonArray weeks=subdoc["weeks"].as<JsonArray>();
        for(JsonObject week:weeks){
          if(!week["days"].is<JsonArray>())continue;
          JsonArray week_days=week["days"].as<JsonArray>();
          for(JsonObject day:week_days)if(kfg_day(value(day["date"]))==target)return day;
        }
        return JsonObject();
      };
      auto entry_period=[&](JsonObject entry,int period){
        if(entry["stunden"].is<JsonArray>()){JsonArray periods=entry["stunden"].as<JsonArray>();for(JsonVariant v:periods)if(atoi(value(v).c_str())==period)return true;}
        std::string raw=value(entry["stunde"]);if(raw.empty()&&entry["stunden"].is<const char*>())raw=value(entry["stunden"]);
        int nums[8],n=0,current=-1;
        for(char c:raw){if(std::isdigit(static_cast<unsigned char>(c))){if(current<0)current=0;current=current*10+(c-'0');}else if(current>=0){if(n<8)nums[n++]=current;current=-1;}}
        if(current>=0&&n<8)nums[n++]=current;
        if(n==2&&raw.find_first_of("-–—")!=std::string::npos){int a=std::min(nums[0],nums[1]),b=std::max(nums[0],nums[1]);return period>=a&&period<=b;}
        for(int i=0;i<n;i++)if(nums[i]==period)return true;
        return n==0;
      };
      auto entry_class_matches=[&](JsonObject entry){
        std::string classes=value(entry["klasse"]);if(classes.empty())return true;
        const std::string wanted=upper("${school_class}");
        std::string token;
        auto matches=[&](){return !token.empty()&&upper(token)==wanted;};
        for(char c:classes){
          if(c==','||c==';'||c=='/'||c=='|'){if(matches())return true;token.clear();}
          else if(!std::isspace(static_cast<unsigned char>(c)))token+=c;
        }
        return matches();
      };
      auto entry_subject_matches=[&](JsonObject entry,JsonObject raw){
        std::string original=value(entry["fach_original"]);if(original.empty())original=value(entry["fach_alt"]);if(original.empty())original=value(entry["subject_original"]);
        std::string current=value(entry["fach"]);if(current.empty())current=value(entry["subject"]);
        const std::string lesson_code=upper(value(raw["subject"]));
        const std::string lesson_name=upper(value(raw["fach"]));
        // KFG entries normally contain the original subject code. Prefer it;
        // only fall back to the current subject when no original code exists.
        std::string candidate=!original.empty()?original:current;
        if(candidate.empty())return false;
        const std::string wanted=upper(candidate);
        return (!lesson_code.empty()&&wanted==lesson_code)||(!lesson_name.empty()&&wanted==lesson_name);
      };
      auto find_entry=[&](JsonObject raw,int64_t date)->JsonObject{
        JsonObject day=substitution_day(date);if(day.isNull()||!day["entries"].is<JsonArray>())return JsonObject();
        JsonArray entries=day["entries"].as<JsonArray>();
        const int first_period=atoi(value(raw["index"]).c_str());
        const int duration=std::max(1,atoi(value(raw["duration"]).c_str()));
        for(JsonObject entry:entries){
          if(!entry_class_matches(entry))continue;
          bool overlaps=false;
          for(int period=first_period;period<first_period+duration;period++)if(entry_period(entry,period)){overlaps=true;break;}
          if(!overlaps)continue;
          // Never apply a substitution from another subject merely because it is
          // the only entry in the same period. This prevents e.g. RKA/Entfall
          // from being attached to ETH on 22.09.
          if(!entry_subject_matches(entry,raw))continue;
          ESP_LOGD("timetable_match","KFG-Zuordnung: %s Std %d-%d Fach %s -> %s / %s",
                   date_string(date).c_str(),first_period,first_period+duration-1,
                   value(raw["subject"]).c_str(),value(entry["art"]).c_str(),value(entry["vertreter"]).c_str());
          return entry;
        }
        return JsonObject();
      };
      // SPH Lerngruppen: Arbeiten/Klausuren/Lernkontrollen werden direkt dem
      // passenden Unterrichtsblock zugeordnet. Matching: Datum + Stunden + Fach.
      auto subject_key=[&](std::string raw){
        raw=upper(raw);std::string key;key.reserve(raw.size());
        for(unsigned char c:raw){
          if((c>='0'&&c<='9')||c==' '||c=='-'||c=='_'||c=='.'||c=='/'||c=='('||c==')')continue;
          key.push_back(static_cast<char>(c));
        }
        return key;
      };
      auto control_period=[&](JsonObject control,int period){
        if(control["stunden"].is<JsonArray>()){
          JsonArray periods=control["stunden"].as<JsonArray>();
          for(JsonVariant v:periods)if(atoi(value(v).c_str())==period)return true;
          return false;
        }
        std::string raw=value(control["stunden_text"]);if(raw.empty())raw=value(control["stunden"]);
        int current=-1;
        for(char c:raw){
          if(std::isdigit(static_cast<unsigned char>(c))){if(current<0)current=0;current=current*10+(c-'0');}
          else if(current>=0){if(current==period)return true;current=-1;}
        }
        return current==period;
      };
      auto control_subject_matches=[&](JsonObject control,JsonObject raw){
        std::string wanted=value(control["fach"]);if(wanted.empty())wanted=value(control["kurs"]);
        if(wanted.empty())return false;
        const std::string a=subject_key(wanted);
        std::string lesson=value(raw["fach"]);if(lesson.empty())lesson=subject_name(value(raw["subject"]));
        const std::string b=subject_key(lesson);
        if(a.empty()||b.empty())return false;
        if(a==b)return true;
        // Course suffixes such as "Englisch 1" / "Französisch 2" are not
        // repeated in the Lerngruppen entry. Require a useful common prefix.
        return a.size()>=4&&b.size()>=4&&(a.rfind(b,0)==0||b.rfind(a,0)==0);
      };
      auto find_control=[&](JsonObject raw,int64_t date)->JsonObject{
        if(!learning_doc["leistungskontrollen"].is<JsonArray>())return JsonObject();
        JsonArray controls=learning_doc["leistungskontrollen"].as<JsonArray>();
        const int first_period=atoi(value(raw["index"]).c_str());
        const int duration=std::max(1,atoi(value(raw["duration"]).c_str()));
        const std::string wanted_date=date_string(date);
        for(JsonObject control:controls){
          if(value(control["datum"])!=wanted_date)continue;
          bool overlaps=false;
          for(int period=first_period;period<first_period+duration;period++)if(control_period(control,period)){overlaps=true;break;}
          if(!overlaps||!control_subject_matches(control,raw))continue;
          ESP_LOGD("timetable_match","Leistungskontrolle: %s Std %d-%d Fach %s -> %s",
                   wanted_date.c_str(),first_period,first_period+duration-1,
                   value(raw["fach"]).c_str(),value(control["art"]).c_str());
          return control;
        }
        return JsonObject();
      };

      // KFG period times. They are also updated from timetable data below, so
      // the renderer remains correct if the source contains slightly different times.
      int slot_start[9]={0,475,520,585,630,700,745,830,875};
      int slot_end[9]  ={0,520,565,630,675,745,790,875,920};
      for(int d=0;d<5;d++){
        int64_t date=monday+d;if(free_day(date))continue;
        JsonArray day=attrs["eigener_plan"][d].as<JsonArray>();
        for(JsonObject lesson:day){if(!visible_lesson(lesson,day,school_week))continue;
          int index=atoi(value(lesson["index"]).c_str());int duration=std::max(1,atoi(value(lesson["duration"]).c_str()));
          int start=minute(value(lesson["start"])),end=minute(value(lesson["end"]));
          if(index<1||index>8||start<0||end<=start)continue;
          double length=double(end-start)/duration;
          for(int off=0;off<duration&&index+off<=8;off++){slot_start[index+off]=int(std::lround(start+length*off));slot_end[index+off]=int(std::lround(start+length*(off+1)));}
        }
      }
      grid_mark("KFG-Daten und Stundenzeiten vorbereitet");

      // Geometry mirrors sph-stundenplan-grid-card: grey header/period column,
      // five equal weekday columns and eight periods. Calendar week and A/B school
      // week share the upper-left header cell, so no separate week row is needed.
      const int left=2,right=W-2,period_w=282;
      const int header_top=CONTENT_TOP+6,header_h=112,body_top=header_top+header_h,body_bottom=H-8;
      const int grid_left=left+period_w,day_w=(right-grid_left)/5,body_h=body_bottom-body_top;
      const Color GRID(188,188,188),META(96,96,96),HEADER(208,208,208);
      // ISO calendar week: the ISO year/week is defined by the Thursday of this Monday-based week.
      auto iso_thursday=esphome::ESPTime::from_epoch_utc((monday+3)*86400);
      int64_t jan4=civil(iso_thursday.year,1,4);
      int jan4_wd=int((jan4+3)%7);if(jan4_wd<0)jan4_wd+=7;
      int64_t week1_monday=jan4-jan4_wd;
      int calendar_week=int((monday-week1_monday)/7)+1;
      char kwbuf[16];snprintf(kwbuf,sizeof(kwbuf),"KW %02d",calendar_week);
      fast_rect(left,header_top,period_w,header_h,HEADER);it.rectangle(left,header_top,period_w,header_h,GRID);
      center(left+period_w/2,header_top+32,kwbuf,id(font_small),INK);
      std::string school_week_text="Woche";
      if(!school_week.empty())school_week_text+=" "+school_week;
      center(left+period_w/2,header_top+80,school_week_text,id(font_small),INK);
      const char* day_names[]={"Montag","Dienstag","Mittwoch","Donnerstag","Freitag"};
      for(int d=0;d<5;d++){
        int x=grid_left+d*day_w;int x2=d==4?right:x+day_w;int w=x2-x;
        fast_rect(x,header_top,w,header_h,HEADER);it.rectangle(x,header_top,w,header_h,GRID);
        auto date=esphome::ESPTime::from_epoch_utc((monday+d)*86400);
        center(x+w/2,header_top+34,day_names[d],id(font_day),INK);
        char dbuf[20];snprintf(dbuf,sizeof(dbuf),"%02d.%02d.%04d",date.day_of_month,date.month,date.year);
        center(x+w/2,header_top+84,dbuf,id(ui_small),INK);
      }
