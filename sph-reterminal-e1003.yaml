    if(id(current_page)==2){
      // Maxim -> Uebersicht: fixed two-column layout with isolated digit refresh.
      if(!now.is_valid()){
        if(!maxim_partial)text(30,CONTENT_TOP+50,"Uhrzeit wird synchronisiert ...",id(ui_body),INK,W-60);
        return;
      }
      const int64_t today_day=[](int y,int m,int d)->int64_t{
        y-=m<=2;int era=(y>=0?y:y-399)/400;
        unsigned yo=y-era*400,doy=(153*(m+(m>2?-3:9))+2)/5+d-1;
        return int64_t(era)*146097+yo*365+yo/4-yo/100+doy-719468;
      }(now.year,now.month,now.day_of_month);
      auto civil=[](int y,int m,int d)->int64_t{
        y-=m<=2;int era=(y>=0?y:y-399)/400;
        unsigned yo=y-era*400,doy=(153*(m+(m>2?-3:9))+2)/5+d-1;
        return int64_t(era)*146097+yo*365+yo/4-yo/100+doy-719468;
      };
      auto day_date=[](int64_t d){return esphome::ESPTime::from_epoch_utc(d*86400);};
      auto short_date=[&](int64_t d){auto t=day_date(d);char b[22];snprintf(b,sizeof(b),"%02d.%02d.%04d",t.day_of_month,t.month,t.year);return std::string(b);};
      auto iso_date=[&](int64_t d){auto t=day_date(d);char b[16];snprintf(b,sizeof(b),"%04d-%02d-%02d",t.year,t.month,t.day_of_month);return std::string(b);};
      auto parse_date=[&](std::string s){int y=0,m=0,d=0;if(sscanf(s.c_str(),"%d-%d-%d",&y,&m,&d)!=3||y<2020||m<1||m>12||d<1||d>31)return int64_t(-1);return civil(y,m,d);};
      auto weekday=[](int64_t d){return int((d+3)%7);}; // Mon=0, Sun=6.
      auto minutes=[](const std::string&s){int h=0,m=0;return sscanf(s.c_str(),"%d:%d",&h,&m)==2&&h<24&&m<60?h*60+m:-1;};
      auto parse_json=[](const std::string&s){return esphome::json::parse_json(s.empty()||s=="unknown"||s=="unavailable"?"{}":s);};
      auto timetable=parse_json(id(epaper_timetable_json).state);
      auto substitutes=parse_json(id(kfg_substitution_json).state);
      auto homework=parse_json(id(epaper_homework_json).state);
