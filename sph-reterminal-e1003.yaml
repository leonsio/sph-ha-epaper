  id: nav_start
  name: E1003 Navigation Start
  icon: mdi:view-dashboard
  entity_category: config
  restore_mode: DISABLED  # State comes from restored nav_visibility_mask.
  lambda: return (id(nav_visibility_mask) & 1U) != 0;
  turn_on_action:
  - lambda: |-
      id(nav_visibility_mask) |= 1U;
      id(nav_start).publish_state(true);
      ESP_LOGI("nav_gate", "Navigation Start: EIN (Maske 0x%X)", (unsigned)id(nav_visibility_mask));
  - script.execute: navigation_visibility_store
  - script.execute: navigation_visibility_changed
  turn_off_action:
  - lambda: |-
      id(nav_visibility_mask) &= ~1U;
      if((id(nav_visibility_mask) & 0x1FU)==0U){
        id(nav_visibility_mask) = 1U; // Keep Start reachable at all times.
        id(nav_start).publish_state(true);
        ESP_LOGW("nav_gate", "Alle Bereiche ausgeschaltet: Start automatisch aktiviert");
