      const bool target_valid=target<today_day+380;
      if(!target_valid)target=today_day;
      if(target_valid&&attrs["eigener_plan"].is<JsonArray>()){
        JsonArray plan=attrs["eigener_plan"].as<JsonArray>();int dow=weekday(target),earliest=1440;
        if(dow<5&&dow<int(plan.size())){JsonArray lessons=plan[dow].as<JsonArray>();
          for(JsonObject l:lessons)if(lesson_visible(l,lessons,week_type(target))){int t=minutes(raw_text(l["start"]));if(t>=0)earliest=std::min(earliest,t);}}
        if(earliest<1440)first_start=earliest;
        else first_start=475;
      }
      auto future=day_date(target);
      struct tm tm_target={};tm_target.tm_year=future.year-1900;tm_target.tm_mon=future.month-1;
      tm_target.tm_mday=future.day_of_month;tm_target.tm_hour=first_start/60;tm_target.tm_min=first_start%60;tm_target.tm_isdst=-1;
      const time_t target_epoch=mktime(&tm_target);
      id(maxim_target_epoch)=target_valid?(int64_t)target_epoch:0;
      id(maxim_displayed_today)=now.strftime("%Y-%m-%d");
      id(maxim_last_minute_key)=int64_t(now.timestamp)/60;
      const int64_t left_seconds=std::max(int64_t(0),int64_t(target_epoch)-int64_t(now.timestamp));
      // Keep countdown digits separate from static unit labels.
      const int64_t school_total_minutes=(left_seconds+59)/60;
      const int64_t school_hours=school_total_minutes/60;
      const int64_t school_minutes=school_total_minutes%60;
      const bool show_school_hours=target_valid && school_hours>0;
      auto card=[&](int slot,int x,int y,int w,int h,std::string key){
