  optimistic: true
  restore_value: true
  initial_option: "Bild"
  options:
    - "Bild"
    - "Digitale Uhr"
    - "Analoge Uhr"
  on_value:
    then:
    - lambda: |-
        esphome::global_preferences->sync();
        if(id(sd_photos).active())id(screensaver_stop).execute();
switch:
- platform: template
  id: screensaver_switch
  name: E1003 Screensaver
  entity_category: config
  icon: mdi:image-multiple
  restore_mode: DISABLED
  lambda: return id(screensaver_enabled) && (id(screensaver_source).current_option()!="Bild" || id(sd_photos).ready());
  turn_on_action:
    - lambda: |-
        if(!(id(screensaver_source).current_option()!="Bild" || id(sd_photos).ready())){
          id(screensaver_switch).publish_state(false);
          ESP_LOGW("sd_screensaver","Screensaver abgelehnt: keine lesbare SD-Karte");
          return;
        }
        id(screensaver_enabled)=true;
        screensaver_enabled->update();esphome::global_preferences->sync();
        id(screensaver_switch).publish_state(true);
        id(sd_photos).activity();
    - script.execute: deep_sleep_idle
  turn_off_action:
    - lambda: |-
        id(screensaver_enabled)=false;
        screensaver_enabled->update();esphome::global_preferences->sync();
        id(screensaver_switch).publish_state(false);
    - script.execute: screensaver_stop
    - script.execute: deep_sleep_idle
- platform: template
  id: deep_sleep_switch
  name: E1003 Deep Sleep
  icon: mdi:power-sleep
  entity_category: config
  optimistic: true
  restore_mode: ${deep_sleep_default}
  on_turn_on:
    - deep_sleep.allow: deep_sleep_control
    - logger.log:
        tag: deep_sleep
        level: INFO
        format: "Deep Sleep EIN: Timeout ${deep_sleep_idle_timeout}, Wake-Timer ${deep_sleep_wakeup_interval}"
    - script.execute: deep_sleep_idle
  on_turn_off:
    - deep_sleep.prevent: deep_sleep_control
    - script.stop: deep_sleep_idle
    - lambda: |-
        id(deep_sleep_prepare_ok) = false;
        if (id(sleep_indicator)) {
          id(sleep_indicator) = false;
          id(status_dirty) = true;
        }
        ESP_LOGI("deep_sleep", "Deep Sleep AUS: Inaktivitaets-Timer gestoppt; OTA/API bleiben erreichbar");
