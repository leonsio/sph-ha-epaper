        const int home_targets[]={1,8,9,10};
        const char* maxim_tabs[]={"Übersicht","Stundenplan","Vertretungsplan","Hausaufgaben","Arbeiten"};
        const int maxim_targets[]={2,3,4,5,6};
        const int count=home_level?4:5;
        for(int i=0;i<count;i++){
          int x=NAV_LEFT+i*(NAV_RIGHT-NAV_LEFT)/count, right=NAV_LEFT+(i+1)*(NAV_RIGHT-NAV_LEFT)/count;
          const bool active=id(current_page)==(home_level?home_targets[i]:maxim_targets[i]);
          fast_rect(x+3,NAV2_TOP,right-x-6,NAV2_BOTTOM-NAV2_TOP,active?INK:LIGHT);
          center((x+right)/2,(NAV2_TOP+NAV2_BOTTOM)/2,home_level?home_tabs[i]:maxim_tabs[i],id(ui_tab),active?PAPER:INK);
          it.rectangle(x,NAV2_TOP,right-x,NAV2_BOTTOM-NAV2_TOP,Color(188,188,188));
        }
      }
    }
    if(repaint_nav)painted_weather_navigation=current_weather_navigation;
    const int wx=W-142;
    const int sleep_state=id(sleep_indicator)?1:0;
    const int sleep_x=wx-36;
    if(repaint_nav || sleep_state!=painted_sleep){
      fast_rect(sleep_x-24,16,48,52,PAPER);
      if(sleep_state){
        center(sleep_x,42,"\U000F04B2",id(mdi_status),INK);
      }
      painted_sleep=sleep_state;
    }
    float rssi=id(wifi_rssi).state;
    int level=wifi::global_wifi_component->is_connected() && std::isfinite(rssi) ? (rssi>=-55?4:rssi>=-65?3:rssi>=-75?2:1):0;
    if(repaint_nav || level!=painted_wifi){
    fast_rect(wx-2,20,50,48,PAPER);
    for(int i=0;i<4;i++){int h=9+8*i;it.rectangle(wx+i*11,60-h,8,h,INK);if(i<level)fast_rect(wx+i*11,60-h,8,h,INK);}
    if(!level)it.line(wx,25,wx+42,62,INK);
    painted_wifi=level;
    }
    const int bx=W-82;
    float battery=id(battery_level).state;
    int battery_pixels=std::isfinite(battery)?int(std::max(0.0f,std::min(100.0f,battery))*0.52f):-1;
    // ESPHome E1003 GPIO1 is battery voltage, not a charger-state pin.
    // Mark external USB power ONLY when a real HA binary sensor says ON.
    const int usb_power=id(e1003_usb_power).has_state()? (id(e1003_usb_power).state?1:0) : -1;
    if(repaint_nav || battery_pixels!=painted_battery || usb_power!=painted_usb){
      fast_rect(bx-2,24,72,42,PAPER);
      it.rectangle(bx,29,60,30,INK);fast_rect(bx+60,38,6,12,INK);
      if(std::isfinite(battery)){
        int fill=int(std::max(0.0f,std::min(100.0f,battery))*0.52f);
        fast_rect(bx+4,33,fill,22,INK);
      } else center(bx+30,44,"?",id(ui_small),INK);
      if(usb_power==1){
        // High-contrast lightning bolt: readable irrespective of battery fill.
        fast_rect(bx+21,32,20,25,PAPER);
        const int ax[7]={33,25,31,26,38,32,37};
        const int ay[7]={33,44,44,55,40,40,33};
        for(int j=0;j<7;j++)it.line(bx+ax[j],ay[j],bx+ax[(j+1)%7],ay[(j+1)%7],INK);
      }
      painted_battery=battery_pixels;
      painted_usb=usb_power;
    }
    if(repaint_nav)it.line(0,CONTENT_TOP-6,W,CONTENT_TOP-6,INK);
    painted_page=id(current_page);
    ESP_LOGI("ui_timing","Navigation: %u ms; Inhalt: %s",(unsigned)(millis()-render_start),content_changed?"neu":"unverändert");
    if(!content_changed)return;
    // Only full refreshes erased the entire buffer; Home partials use local clears.
    if(id(current_page)==8) {
      const uint32_t home_begin=millis();
      struct HomeTiming {
        uint32_t started;
        ~HomeTiming(){ESP_LOGD("home_timing","Home: Seitenaufbau gesamt: %u ms (ohne anschließenden Panel-Refresh)",(unsigned)(millis()-started));}
      } home_timing{render_start};
      auto l=epaper_home::Layout{W,H};
      l.top=184; // floor headers/room tiles start directly below Home submenu
      const int DEVICE_TOP=250; // keep title/message above five device cards
      const int DEVICE_ROWS=std::max(1,(H-DEVICE_TOP-95)/l.card_h);
      const int PAGER_TOP=H-98;
      auto doc=esphome::json::parse_json(id(home_rooms_json).state);
      if(doc.isNull() || doc.overflowed() || !doc["rooms"].is<JsonArray>()) {
        if(home_partial){
          fast_rect(12,CONTENT_TOP,W-24,H-CONTENT_TOP,PAPER);
          it.rectangle(12,CONTENT_TOP,W-24,H-CONTENT_TOP,PAPER);
        }
        id(home_render_json)="{}";
        text(28,CONTENT_TOP+28,"Raumdaten fehlen – Home-Assistant-Paket einrichten.",id(font_day),INK,W-56);
        text(28,CONTENT_TOP+95,"Erwartet: ${home_rooms_entity} / Attribut payload",id(font_small),INK,W-56);
        return;
      }
      ESP_LOGD("home_timing","Home: JSON-Auswertung: %u ms, %u Bytes",(unsigned)(millis()-home_begin),(unsigned)id(home_rooms_json).state.size());
      const uint32_t home_navigation_begin=millis();
      auto old_doc=esphome::json::parse_json(id(home_render_json));
      JsonArray old_rooms=old_doc["rooms"].as<JsonArray>();
      JsonArray rooms=doc["rooms"].as<JsonArray>();
      // The sensor's rooms[] objects accept floor/floor_name/etage/f.
      // Preserve their original relative order inside each HA floor group.
      auto room_floor=[](JsonObject r)->std::string {
        std::string floor=r["floor"] | "";
        if(floor.empty())floor=r["floor_name"] | "";
        if(floor.empty())floor=r["etage"] | "";
        if(floor.empty())floor=r["f"] | "";
        return floor.empty()?std::string("Ohne Etage"):floor;
      };
      auto &order=id(home_room_order);
      auto &floors=id(home_room_floors);
      order.clear();floors.clear();
      std::vector<std::string> floor_names;
      bool unassigned=false;
      for(int i=0;i<(int)rooms.size();i++){
        JsonObject r=rooms[i].as<JsonObject>();
        JsonArray room_devices=r["entities"].as<JsonArray>();
        if(room_devices.isNull() || room_devices.size()==0)continue;
        order.push_back(i);
        const std::string floor=room_floor(r);
        if(floor=="Ohne Etage")unassigned=true;
        else if(std::find(floor_names.begin(),floor_names.end(),floor)==floor_names.end())floor_names.push_back(floor);
      }
      if(unassigned)floor_names.push_back("Ohne Etage");
      // Physical top-to-bottom order (same as HA Floors dashboard).
      auto floor_rank=[](const std::string &f)->int {
        if(f=="Dachgeschoss" || f=="Dachgeschoß")return 0;
        if(f=="Obergeschoss" || f=="Obergeschoß")return 1;
        if(f=="Erdgeschoss" || f=="Erdgeschoß")return 2;
        if(f=="Untergeschoss" || f=="Untergeschoß" || f=="Kellergeschoss")return 3;
        if(f=="Ohne Etage")return 99;
        return 50;
      };
      std::stable_sort(order.begin(),order.end(),[&](int a,int b){
        const auto fa=room_floor(rooms[a].as<JsonObject>()),fb=room_floor(rooms[b].as<JsonObject>());
        const int ra=floor_rank(fa),rb=floor_rank(fb);
        if(ra!=rb)return ra<rb;
        if(fa!=fb)return fa<fb;
        std::string na=rooms[a]["n"] | "",nb=rooms[b]["n"] | "";
        return na<nb;
      });
      for(int i:order)floors.push_back(room_floor(rooms[i].as<JsonObject>()));
      JsonObject selected;
      for(int i:order){
        JsonObject r=rooms[i].as<JsonObject>();
        if(r["id"].as<std::string>()==id(home_selected_room)){selected=r;break;}
      }
      if(selected.isNull()){
        if(!order.empty())selected=rooms[order.front()].as<JsonObject>();
